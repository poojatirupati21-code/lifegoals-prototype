<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeGoals · Understand Me prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>:root{
  --navy:#16213A;--ink:#1B2440;--muted:#5A6378;--line:#E2E6EF;--bg:#F4F6FA;--card:#FFFFFF;
  --teal:#2E8C8E;--teal-d:#236F71;--teal-l:#E3F2F2;
  --plum1:#1C1340;--plum2:#34195F;--plum3:#4B1E74;
  --ok:#1E7F52;--ok-l:#E4F4EC;--warn:#A1620B;--warn-l:#FCF1DF;--bad:#B23A48;
  --c1:#6D28D9;--c2:#2F6FDB;--c3:#16865A;--c4:#C2367D;--c5:#0F7F86;--c6:#C94A2C;--c7:#A7610B;--c8:#4338CA;
  --logo1:#7B3FE4;--logo2:#C04BD8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:#E7EAF2;display:flex;min-height:100vh}
button{font-family:inherit}
aside.side{width:290px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:26px 20px;overflow-y:auto}
.side h1{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.side p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 16px}
.side h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.side button{display:block;width:100%;text-align:left;min-height:38px;padding:8px 12px;margin-bottom:3px;border:0;border-radius:10px;background:transparent;font-size:13.5px;color:var(--ink);cursor:pointer}
.side button:hover{background:#F0F2F8}
.side button.on{background:var(--navy);color:#fff;font-weight:700}
.stage{flex-grow:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.wrap{width:390px;height:844px;flex-shrink:0;transform-origin:center}
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 10px #0F172A,0 30px 70px rgba(15,23,42,.3)}
@media (max-width:780px){body{display:block}aside.side{display:none}.stage{padding:0;height:100vh}.phone{border-radius:0;box-shadow:none}}
/* app frame */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.topbar{height:92px;padding:44px 16px 0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--logo1),var(--logo2));display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.logo small{font-weight:500;font-size:11px;opacity:.75}
.iconbtn{min-width:44px;height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.scroll{flex-grow:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 24px}
.scroll > *{flex-shrink:0}
.tabs{height:78px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:7px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:48px;font-size:10.5px;font-weight:600;color:#5A6378;cursor:pointer}
.tabs button.on{color:var(--teal-d);font-weight:800}
.tabs svg{width:23px;height:23px}
/* type */
h2.h{font-size:24px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 16px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-d)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h3{margin:0;font-size:16px}
.link{border:0;background:none;color:var(--teal-d);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:25px;border:0;background:var(--teal);color:#fff;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--navy)}
.btn.sm{min-height:40px;font-size:13.5px;width:auto;padding:0 16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:11.5px;font-weight:700;background:#EEF0F6;color:var(--ink)}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.warn{background:var(--warn-l);color:var(--warn)}.pill.teal{background:var(--teal-l);color:var(--teal-d)}
.hstrip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hstrip::-webkit-scrollbar{display:none}
.tool{flex-shrink:0;width:118px;min-height:104px;border-radius:18px;padding:12px;color:#fff;border:0;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-size:13.5px;font-weight:700;line-height:1.25}
.tool .em{font-size:24px}
.tool small{font-weight:500;opacity:.9;font-size:11px}
/* assessment tiles */
.atile{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;color:var(--ink);min-height:68px}
.atile .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:#fff}
.atile b{font-size:14.5px;display:block}
.atile span.m{font-size:12px;color:var(--muted)}
.atile .st{margin-left:auto;flex-shrink:0}
/* ring */
.ring{position:relative;width:86px;height:86px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
/* dark quiz */
.quiz{position:absolute;inset:0;background:radial-gradient(120% 80% at 80% 0%,var(--plum3),var(--plum2) 45%,var(--plum1));color:#fff;display:flex;flex-direction:column}
.qtop{padding:52px 18px 0;display:flex;align-items:center;gap:12px}
.qbar{flex-grow:1;display:flex;gap:5px}
.qbar i{flex-grow:1;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.qbar i.on{background:#5EEAD4}
.qx{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer}
.qbody{flex-grow:1;overflow-y:auto;padding:18px 18px 24px}
.qeye{font-size:11px;font-weight:800;letter-spacing:.14em;color:#5EEAD4;text-transform:uppercase}
.qbody h2{font-size:26px;line-height:1.15;margin:8px 0 6px;letter-spacing:-.01em}
.qbody p.qs{font-size:14px;color:#D9D3F0;margin:0 0 18px;line-height:1.45}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;border:0;border-radius:18px;padding:14px 14px;min-height:74px;color:#fff;text-align:left;font-size:15px;font-weight:700;line-height:1.3;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform .15s}
.opts.two .opt{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:118px}
.opt:hover{transform:translateY(-2px)}
.opt .em{font-size:26px;flex-shrink:0}
.opt.sel{outline:3px solid #5EEAD4;outline-offset:2px}
.opt .badge{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:13px;background:#fff;color:var(--plum2);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.qfoot{padding:0 18px 30px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.qback{border:0;background:none;color:#D9D3F0;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}
.qnote{font-size:12px;color:#CFC7EA;line-height:1.45;margin-top:16px}
.conf{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.conf button{flex:1;min-height:44px;border-radius:22px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.conf button.sel{background:#5EEAD4;color:var(--plum1);border-color:#5EEAD4}
.scen{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;margin-bottom:16px}
.scen .v{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.scen .v div{font-size:13px;color:#D9D3F0}
.scen .v b{display:block;font-size:26px;color:#fff}
/* intro */
.intro .hero{font-size:64px;margin:6px 0 8px}
.intro ul{padding:0;margin:18px 0;list-style:none;display:grid;gap:10px}
.intro li{display:flex;gap:10px;font-size:14px;line-height:1.45;color:#E7E2F8}
.intro li i{font-style:normal;width:26px;height:26px;border-radius:13px;background:rgba(94,234,212,.18);color:#5EEAD4;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:800}
.wbtn{display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border-radius:27px;border:0;background:#fff;color:var(--plum2);font-weight:800;font-size:15.5px;cursor:pointer;width:100%}
.disc{font-size:11.5px;line-height:1.5;color:var(--muted);background:#EEF1F7;border-radius:12px;padding:10px 12px;margin-top:14px}
.quiz .disc{background:rgba(255,255,255,.08);color:#CFC7EA}
/* result */
.res-hero{border-radius:24px;padding:20px;color:#fff;background:radial-gradient(120% 90% at 90% 0%,var(--plum3),var(--plum1));position:relative;overflow:hidden}
.res-hero .big{font-size:34px;font-weight:800;line-height:1.05;margin:6px 0 6px;background:linear-gradient(90deg,#5EEAD4,#C4B5FD);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-hero .sec2{font-size:13px;color:#D9D3F0}
.res-hero p{font-size:14px;line-height:1.5;color:#E7E2F8;margin:8px 0 0}
.bars{display:grid;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:104px 1fr 34px;align-items:center;gap:10px;font-size:12.5px;font-weight:600}
.bar .t{height:9px;border-radius:5px;background:#E8EBF3;overflow:hidden}
.res-hero .bar .t{background:rgba(255,255,255,.15)}
.bar .t i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),#5EEAD4)}
.bar em{font-style:normal;color:var(--muted);font-size:11.5px;text-align:right}
.res-hero .bar em{color:#CFC7EA}
.trio{display:grid;gap:10px;margin-top:14px}
.trio .card h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.trio .card p,.trio .card li{font-size:13.5px;line-height:1.5;margin:0}
.trio ul{margin:0;padding-left:18px}
.k-ok{color:var(--ok)}.k-warn{color:var(--warn)}.k-teal{color:var(--teal-d)}
.levels{display:grid;gap:8px;margin-top:12px}
.lvl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600}
.next{border-radius:20px;padding:16px;background:var(--teal-l);border:1px solid #BFE2E2;margin-top:14px}
.next b{display:block;font-size:15px;margin:4px 0}
.next p{font-size:13px;margin:0 0 12px;color:#2B4A4B;line-height:1.45}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.cmp .card{text-align:center}
.cmp .card b{display:block;font-size:20px;margin-top:4px}
.gauge{height:10px;border-radius:5px;background:#E8EBF3;margin-top:10px;position:relative}
.gauge i{position:absolute;top:-4px;width:18px;height:18px;border-radius:9px;background:var(--navy);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translateX(-50%)}
/* profile */
.pcard{border-radius:18px;padding:14px;background:#fff;border:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink);min-height:106px;display:flex;flex-direction:column;gap:4px;width:100%}
.pcard small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pcard b{font-size:16px;line-height:1.2}
.pcard span{font-size:11.5px;color:var(--muted);margin-top:auto}
.pcard.empty{border-style:dashed;background:#FAFBFD}
.pcard.empty b{color:var(--muted);font-size:14px}
/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-height:86%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px 28px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#D5DAE5;margin:4px auto 14px}
/* calculators */
.cat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;color:#fff;border:0;width:100%;text-align:left;cursor:pointer;min-height:76px}
.cat .em{font-size:28px}
.cat b{display:block;font-size:16px}
.cat span{font-size:12px;opacity:.92}
.clist{display:grid;gap:8px}
.citem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14.5px;font-weight:600;cursor:pointer;width:100%;text-align:left;color:var(--ink);min-height:54px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.field label output{color:var(--teal-d);font-weight:800}
input[type=range]{width:100%;accent-color:var(--teal);height:28px}
.result{border-radius:22px;background:var(--navy);color:#fff;padding:18px}
.result .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9FB0D0;font-weight:700}
.result .val{font-size:34px;font-weight:800;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.result p{font-size:13.5px;line-height:1.5;color:#D6DEEE;margin:0}
.result table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.result td{padding:7px 0;border-top:1px solid rgba(255,255,255,.12)}
.result td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.acts .btn{min-height:46px;font-size:13.5px;padding:0 10px}
.wi{border-radius:20px;border:1.5px dashed #BFC7D8;padding:14px;margin-top:16px;background:#FBFCFE}
.wi h4{margin:0 0 4px;font-size:15px}
/* LifeMap */
.lm-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px 8px}
.lm{position:relative;height:250px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.lm .axis{position:absolute;left:0;right:0;bottom:44px;height:3px;background:linear-gradient(90deg,#2E8C8E,#5EEAD4,#E7A546)}
.lm .tick{position:absolute;bottom:18px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.lm .tick::before{content:'';position:absolute;left:50%;top:-12px;width:1px;height:8px;background:#C8CFDD}
.chip{position:absolute;transform:translateX(-50%);display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border-radius:17px;background:#fff;border:2px solid var(--teal);font-size:12.5px;font-weight:700;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;box-shadow:0 3px 8px rgba(22,33,58,.12);color:var(--ink)}
.chip.drag{cursor:grabbing;box-shadow:0 10px 20px rgba(22,33,58,.25);z-index:5;border-color:var(--c1)}
.chip.new{animation:pop .6s ease}
.chip .yr{font-weight:600;color:var(--muted);font-size:11px}
.chip::after{content:'';position:absolute;left:50%;top:32px;width:2px;height:var(--stem,40px);background:#C8CFDD}
@keyframes pop{0%{transform:translateX(-50%) scale(.5)}60%{transform:translateX(-50%) scale(1.12)}100%{transform:translateX(-50%) scale(1)}}
.youmark{position:absolute;bottom:38px;width:14px;height:14px;border-radius:7px;background:var(--navy);border:3px solid #fff;transform:translateX(-50%);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tray button{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:20px;border:1.5px dashed #AEB7CA;background:#fff;font-size:13px;font-weight:600;cursor:grab;touch-action:none;color:var(--ink)}
.ms{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 0}
.ms i{font-style:normal;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.ms i.y{background:var(--ok);color:#fff}.ms i.n{background:#E8EBF3;color:var(--muted)}
.chap{border-left:0;border-radius:16px;padding:14px;background:#fff;border:1px solid var(--line);margin-bottom:10px}
.chap b{font-size:15px}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .35s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.segs{display:flex;gap:4px;padding:4px;border-radius:14px;background:#E8EBF3;margin-bottom:14px}
.segs button{flex:1;min-height:38px;border:0;border-radius:11px;background:transparent;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.segs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* chat */
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.5;margin-bottom:10px}
.msg.me{margin-left:auto;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.msg.ai{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.chatin{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.chatin input{flex-grow:1;min-height:44px;border-radius:22px;border:1.5px solid var(--line);padding:0 14px;font-family:inherit;font-size:14px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sugg button{border:1.5px solid var(--line);background:#fff;border-radius:18px;min-height:38px;padding:0 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.vid{flex-shrink:0;width:200px}
.vid .th{height:112px;border-radius:14px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:11px;font-weight:700;position:relative}
.vid .th::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.9);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:14px;padding-left:3px}
.vid b{display:block;font-size:13.5px;margin-top:8px;line-height:1.3}
.vid span{font-size:12px;color:var(--muted)}
.back{border:0;background:none;display:flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);cursor:pointer;min-height:40px;padding:0;font-size:14px;margin:-6px 0 8px}
.scroll.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.planbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
#planhost{flex-grow:1;min-height:0}
</style>
</head>
<body>
<aside class="side">
<h1><span style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7B3FE4,#C04BD8);color:#fff;display:inline-flex;align-items:center;justify-content:center">◔</span>LifeGoals</h1>
<p>Understand Me: an interactive mobile prototype. Try a persona to see how the app personalises itself, or jump to any screen.</p>
<h2>Persona</h2><div id="personas"></div>
<h2>Jump to</h2><div id="jumps"></div>

<script>
// ===== Assessments: questions, scoring and result content =====
const DISC_FORMAL = 'This tool is designed to help you explore your preferences. It does not replace a formal suitability or risk assessment where financial advice is provided.';
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'];

function sumDims(a, answers){
  const s = {}, mx = {};
  a.dims.forEach(d => { s[d.k] = 0; mx[d.k] = 0; });
  a.qs.forEach((q, qi) => {
    a.dims.forEach(d => { mx[d.k] += Math.max(0, ...q.o.map(o => (o.w && o.w[d.k]) || 0)); });
    const o = q.o[answers[qi]];
    if (o && o.w) Object.keys(o.w).forEach(k => { if (k in s) s[k] += o.w[k]; });
  });
  return { s, mx };
}
function pct(v, m){ return m ? Math.max(6, Math.round(v / m * 100)) : 6; }
function blend(a, answers){
  const { s, mx } = sumDims(a, answers);
  const ranked = a.dims.map(d => ({ k: d.k, label: d.label, v: pct(s[d.k], mx[d.k]) })).sort((x, y) => y.v - x.v);
  return { ranked, primary: a.profiles[ranked[0].k], secondary: a.profiles[ranked[1].k], close: ranked[0].v - ranked[1].v < 10,
    bars: a.dims.map(d => ({ label: d.label, v: pct(s[d.k], mx[d.k]) })) };
}
function lvl3(n, hi, mid){ return n >= hi ? 'High' : n >= mid ? 'Moderate' : 'Low'; }

{ id:'habits', name:'Money Habits', short:'Money habits', group:'How I act', mins:3, em:'🧾', color:'var(--c3)', kind:'custom',
  why:'Habits matter more than any single decision. This is about what you usually do, not what you think you should do.',
  get:['Your money-handling style','Strengths and one thing to watch','A small, practical next step'],
  dims:[{k:'plan',label:'Planning ahead'},{k:'track',label:'Keeping track'},{k:'imp',label:'Spontaneity'},{k:'avoid',label:'Putting things off'}],
  qs:[
    { h:'When your salary lands, what usually happens first?', o:[
      {t:'Savings move out automatically', em:'🔁', w:{plan:2}},

    { h:'How often do you review your pension?', o:[

      {t:'Within a week or two', em:'🗓️', w:{track:1}},
      {t:'When I get a reminder', em:'🔔', w:{avoid:1}},
      {t:'It tends to pile up', em:'📚', w:{avoid:2}} ]},
    { h:'How do you usually approach money goals?', o:[
      {t:'Written down with amounts and dates', em:'📝', w:{plan:2,goal:1}},
      {t:'In my head, roughly', em:'💭', w:{plan:1}},
      {t:'I start strong, then drift', em:'🌊', w:{imp:1}},
      {t:"I'd rather not set them", em:'🌀', w:{avoid:1}} ]}
  ],
  profiles:{
    organised:{name:'Organised Planner', line:'You stay on top of money admin and plan ahead. Things rarely catch you by surprise.', strengths:['Consistent','Prepared for the unexpected'], watch:'A very tidy system can make it easy to miss the bigger picture, like whether your goals still fit your life.', tryThis:'Book one annual LifeGoals review to check the big picture.', tool:'goalplanner'},
    goal:{name:'Goal Driven', line:'You set clear goals with dates and amounts, and you work towards them.', strengths:['Motivated by clear targets','Great at following through'], watch:'Goals need protecting too. Check that illness or a job change would not derail them.', tryThis:'Check your income protection gap.', tool:'incomegap'},
    ontrack:{name:'Mostly on Track', line:'You keep a reasonable eye on things, with a few areas that could use a little attention.', strengths:['Aware of your money','Adaptable'], watch:'Reviews of pensions or insurance can slip down the list.', tryThis:'Find your monthly surplus: it is the base for every goal.', tool:'surplus'},
    flex:{name:'Flexible Spender', line:'You enjoy spending in the moment and adapt as you go.', strengths:['Enjoys life','Responds quickly to change'], watch:'Without a plan, saving can end up as "whatever is left".', tryThis:'Try "save first": see what a small automatic amount grows into.', tool:'compound'},
    reactive:{name:'Reactive Manager', line:'You tend to deal with financial decisions when they become relevant, rather than planning far ahead.', strengths:['Flexible','Responsive'], watch:'Important financial reviews can be delayed.', tryThis:'Set one annual LifeGoals review.', tool:'emergency'},
    avoid:{name:'Financial Avoider', line:'Money admin is not your favourite thing, so it often waits until it is pressing. That is very common.', strengths:['Calm under pressure','Not driven by money worries day to day'], watch:'Small things left alone, like old pensions or renewals, can quietly cost more over time.', tryThis:'Take one small step: know your monthly number.', tool:'surplus'}
  },
  compute(ans){
    const { s, mx } = sumDims(this, ans.a);
    const goalAns = ans.a[5] === 0;
    let key = 'ontrack';
    if (s.avoid >= 5) key = 'avoid';
    else if (s.plan >= 7) key = goalAns ? 'goal' : 'organised';
    else if (s.imp >= 2 && s.plan < 5) key = 'flex';
    else if (s.plan + s.track >= 6) key = 'ontrack';
    else key = 'reactive';
    const p = this.profiles[key];
    return { label:p.name, short:p.name, bars:this.dims.map(d => ({label:d.label, v:pct(s[d.k], mx[d.k])})), line:p.line, strengths:p.strengths, watch:p.watch, tryThis:p.tryThis,
      personalise:['How often and how gently we nudge you','Whether reminders come bundled or one at a time','Habit-building courses on Home'], next:{tool:p.tool, why:p.tryThis} };
  } },

{ id:'investor', name:'Investor Style', short:'Investor style', group:'Risk & investing', mins:3, em:'🌱', color:'var(--c5)', kind:'custom', formal:true,
  why:'An educational look at how you naturally approach investing: stability, growth, access to your money and patience.',
  get:['Your natural investor style','How you balance stability, growth, access and time','Learning matched to your style'],
  dims:[{k:'stab',label:'Stability'},{k:'growth',label:'Growth'},{k:'liq',label:'Access to cash'},{k:'long',label:'Long-term focus'}],
  qs:[
    { h:'€20,000 you invested is worth €17,000 after six months. How would you initially feel?', o:[

      {t:'Not really', em:'😎', w:{long:2}},
      {t:'Not at all', em:'🧘', w:{long:2,growth:1}} ]},
    { h:'How quickly might you need to access this money?', o:[
      {t:'At any time', em:'⚡', w:{liq:3}},
      {t:'Within a year or two', em:'📆', w:{liq:2}},
      {t:'In a few years', em:'🗓️', w:{liq:1,long:1}},
      {t:'Not for 10+ years', em:'🌳', w:{long:2}} ]},
    { h:'How much experience do you have with investing?', o:[
      {t:'None yet', em:'🌱', w:{stab:1}},
      {t:'I know the basics', em:'📘', w:{}},
      {t:'Fairly comfortable', em:'📊', w:{growth:1}},
      {t:'Very experienced', em:'🎓', w:{growth:2}} ]},
    { h:'How would you rather spread your money?', o:[
      {t:'Keep it in one safe place', em:'🏦', w:{stab:2}},
      {t:'A few different places', em:'🧺', w:{stab:1,growth:1}},
      {t:'Widely spread across many investments', em:'🌍', w:{long:1,growth:1}},
      {t:'A few bigger bets I believe in', em:'🎯', w:{growth:2}} ]},
    { h:'Once invested, how often would you check it?', o:[
      {t:'Most days', em:'📱', w:{liq:1,stab:1}},
      {t:'Every month', em:'🗓️', w:{}},
      {t:'Once or twice a year', em:'📅', w:{long:1}},
      {t:'Rarely. I would leave it alone', em:'🌙', w:{long:2}} ]}
  ],
  bands:[
    {name:'Capital Protector', line:'Protecting what you have matters most. You prefer steadiness over big growth.'},
    {name:'Cautious Builder', line:'You want to grow your money, but carefully, with stability as the priority.'},
    {name:'Balanced Builder', line:'You look for a balance: some stability, with steady long-term growth.'},
    {name:'Long-Term Growth Investor', line:'You are patient and comfortable riding out ups and downs for long-term growth.'},
    {name:'Growth Explorer', line:'You are drawn to growth and opportunity, and short-term swings do not worry you much.'}
  ],
  compute(ans){
    const { s, mx } = sumDims(this, ans.a);
    const c = s.growth + s.long - s.stab;
    const i = c < -3 ? 0 : c < 1 ? 1 : c < 5 ? 2 : c < 8 ? 3 : 4;
    const b = this.bands[i];
    const tips = [
      {st:['Values steadiness','Unlikely to make panicked decisions'], w:'Money kept very safe for decades can lose buying power to inflation.', t:'See how inflation affects money over time.', tool:'realreturn'},
      {st:['Careful and considered','Protects the downside'], w:'Being very cautious with long-term money can mean slower progress towards big goals.', t:'See how regular investing builds over time.', tool:'regularinvest'},
      {st:['Keeps perspective','Balances today and tomorrow'], w:'Balanced does not mean "no ups and downs". Knowing what a fall might look like helps.', t:'Explore the risk and return simulator.', tool:'riskreturn'},
      {st:['Patient','Thinks in decades'], w:'Your capacity for loss matters as much as your comfort. Check your cushion first.', t:'Check how much you could afford to see fall.', tool:'emergency'},
      {st:['Curious and open to opportunity','Not easily rattled'], w:'Growth-seeking can lead to concentration or chasing trends. Fees and spreading money out matter.', t:'See how fees affect growth over time.', tool:'fees'}
    ][i];
    return { label:b.name, short:b.name, band:i, bands:this.bands.map(x => x.name), bars:this.dims.map(d => ({label:d.label, v:pct(s[d.k], mx[d.k])})),
      line:b.line, strengths:tips.st, watch:tips.w, tryThis:tips.t, formal:true,
      personalise:['Which investing lessons we show you','Example assumptions in calculators (you can always change them)','The type of expert suggested if you want to talk'], next:{tool:tips.tool, why:tips.t} };
  } },

    { h:"If you couldn't work for 6 months due to illness, what would happen?", f:'prot', o:[{t:"I'm not sure",em:'❓',sc:0},{t:'We would struggle',em:'😟',sc:0},{t:'Savings would cover some of it',em:'🐷',sc:1},{t:'Income protection or sick pay covers it',em:'🛡️',sc:3}]},
    { h:'A €1,000 surprise cost tomorrow. Could you pay it without borrowing?', f:'ef', o:[{t:'No',em:'✖️',sc:0},{t:'Probably not',em:'😬',sc:1},{t:'Probably',em:'🙂',sc:2},{t:'Easily',em:'✅',sc:3}]}
  ],
  compute(ans){
    const f = {ef:[], cf:[], debt:[], inc:[], prot:[]};
    this.qs.forEach((q, i) => f[q.f].push((q.o[ans.a[i]] || {}).sc || 0));
    const names = {ef:'Emergency fund', cf:'Monthly cashflow', debt:'Debt', inc:'Income security', prot:'Protection'};
    const lv = v => v >= 2.5 ? {t:'Strong', c:'ok'} : v >= 1.5 ? {t:'Moderate', c:'teal'} : {t:'Needs attention', c:'warn'};
    const levels = Object.keys(f).map(k => { const v = f[k].reduce((a, b) => a + b, 0) / f[k].length; return {k, label:names[k], v, ...lv(v)}; });
    const avg = levels.reduce((a, b) => a + b.v, 0) / levels.length;
    const overall = avg >= 2.3 ? 'Strong' : avg >= 1.4 ? 'Solid' : 'Developing';
    const weakest = levels.slice().sort((a, b) => a.v - b.v)[0];
    const toolFor = {ef:'emergency', cf:'surplus', debt:'debtpay', inc:'incomegap', prot:'lifecover'};

    const confN = ['Low','Medium','High'];

// ===== Calculators =====
const eur = n => (n < 0 ? '−€' : '€') + Math.round(Math.abs(n)).toLocaleString('en-IE');
const fvL = (p, r, y) => p * Math.pow(1 + r / 100, y);
const fvA = (m, r, y) => { const i = r / 100 / 12, n = y * 12; return i ? m * (Math.pow(1 + i, n) - 1) / i : m * n; };
const pmt = (P, r, y) => { const i = r / 100 / 12, n = y * 12; return i ? P * i / (1 - Math.pow(1 + i, -n)) : P / n; };
const yrs = m => { const y = Math.floor(m / 12), mo = Math.round(m % 12); return y ? y + ' yr' + (y > 1 ? 's' : '') + (mo ? ' ' + mo + ' mo' : '') : mo + ' months'; };
function payoff(bal, r, pay){ let m = 0, int = 0; const i = r / 100 / 12; while (bal > 0 && m < 1200){ const it = bal * i; int += it; bal = bal + it - pay; m++; if (pay <= it) return {m:Infinity, int}; } return {m, int}; }
function lasts(pot, w, g, inf){ let y = 0; while (pot > 0 && y < 60){ pot = pot * (1 + g / 100) - w; w *= 1 + inf / 100; y++; } return y; }

  S = {persona:p, user:{name:P.name, age:P.age}, res:{}, ans:{}, goals:[], saved:[], ms:{}, tab:'home', stack:[{v:'home'}], quiz:null, sheet:null, seg:'map', chat:[], calcV:{}, toast:null, last:null};
  Object.keys(P.done).forEach(id => { S.ans[id] = P.done[id]; const r = A(id).compute(Object.assign({a:[], conf:[], rank:[]}, P.done[id])); S.res[id] = {r, date:'12 Sep 2026', hist:[{date:'12 Sep 2026', label:r.short}]}; });
  P.goals.forEach(g => S.goals.push({id:gid++, name:g[0], em:g[1], amount:g[2], age:g[3]}));
  S.last = p === 'aoife' ? 'mindset' : p === 'declan' ? 'investor' : null;
  checkMilestones(true);
}
const res = id => S.res[id] && S.res[id].r;
const done = id => !!S.res[id];
const pctDone = () => Math.round(ASSESS.filter(a => done(a.id)).length / ASSESS.length * 100);
const cur = () => S.stack[S.stack.length - 1];
function go(v, p){ S.stack.push({v, p}); S.sheet = null; render(true); }
function back(){ if (S.stack.length > 1) S.stack.pop(); render(true); }
function tab(t){ S.tab = t; S.stack = [{v:t}]; S.sheet = null; S.quiz = null; render(true); }
function toast(msg, em){ S.toast = {msg, em:em || '✨'}; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2800); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- milestones ----------
const MILESTONES = [
  ['first','First part of your profile discovered', () => Object.keys(S.res).length >= 1],
  ['half','Profile 50% discovered', () => pctDone() >= 50],
  ['found','Financial foundations checked', () => done('resilience')],
  ['goal1','First goal on your LifeMap', () => S.goals.length >= 1],
  ['goal3','Three goals on your LifeMap', () => S.goals.length >= 3],
  ['calc','First calculator result added to your plan', () => S.ms.calcAdded],
  ['all','Full financial profile discovered', () => pctDone() === 100]
];
function checkMilestones(silent){
  MILESTONES.forEach(([k, t, f]) => { if (!S.ms[k] && f()) { S.ms[k] = true; if (!silent) setTimeout(() => toast('Plan milestone: ' + t, '🏅'), 400); } });
}

// ---------- quiz ----------
function startQuiz(id){ const a = A(id); S.quiz = {id, i:-1, a:[], conf:[], rank:[]}; S.sheet = null; render(true); }
function finishQuiz(){
  const q = S.quiz, a = A(q.id), r = a.compute(q);
  const prev = S.res[q.id];
  S.res[q.id] = {r, date:TODAY, hist:(prev ? prev.hist : []).concat([{date:TODAY, label:r.short}])};
  S.ans[q.id] = {a:q.a, conf:q.conf, rank:q.rank}; S.last = q.id; S.quiz = null; if (S.tab !== 'um') { S.tab = 'um'; S.stack = [{v:'um'}]; }
  S.stack.push({v:'result', p:q.id}); render(true); checkMilestones();
}
function quizHTML(){

  if (q.i < 0) return '<div class="quiz intro">' + top + '<div class="qbody"><div class="qeye">Understand Me · ' + a.mins + ' min</div><div class="hero" aria-hidden="true">' + a.em + '</div><h2>' + a.name + '</h2><p class="qs">' + esc(a.why) + '</p>' +

      '<div class="qfoot"><button class="qback" data-a="qprev">← Back</button><button class="wbtn" style="width:auto;opacity:' + (q.rank.length >= 3 ? 1 : .45) + '" data-a="' + (q.rank.length >= 3 ? 'qdone' : 'noop') + '">See my priorities →</button></div></div>';
  }

  const opts = Q.o.map((o, k) => {
    const sel = q.a[q.i] === k;

  const sub = Q.s || (a.kind === 'kc' ? 'Topic: ' + Q.topic + '. Go with what you think.' : Q.scen ? 'How would you react?' : 'Tap the card that feels most like you.');
  return '<div class="quiz">' + top + '<div class="qbody"><div class="qeye">' + a.name + ' · ' + (q.i + 1) + ' of ' + n + '</div><h2>' + esc(Q.h) + '</h2><p class="qs">' + esc(sub) + '</p>' + extra +

}

const bars = b => '<div class="bars">' + b.map(x => '<div class="bar"><span>' + x.label + '</span><div class="t"><i style="width:' + x.v + '%"></i></div><em>' + x.v + '</em></div>').join('') + '</div>';

function nextAssess(){ return ['priorities','mindset','resilience','risk','investor','capacity','habits','planning','knowledge','biases'].find(id => !done(id)); }
function toolTile(t){
  if (t.type === 'assess') { const a = A(t.id); return '<button class="tool" style="background:' + a.color + '" data-a="startq" data-p="' + a.id + '"><span class="em">' + a.em + '</span><span>' + a.name + '<br><small>' + a.mins + ' min · discover</small></span></button>'; }
  const c = C(t.id), cat = CATS.find(x => x.id === c.cat);

}
function toolsForYou(){
  const out = [], add = x => { if (x && !out.find(o => o.id === x.id)) out.push(x); };
  const pr = (res('priorities') || {}).top || [];
  if (S.user.age >= 50) { add({type:'calc', id:'retirement'}); add({type:'calc', id:'lastmoney'}); if (!done('risk')) add({type:'assess', id:'risk'}); }
  pr.slice(0, 3).forEach(p => add({type:'calc', id:p.tool}));
  if (pr.find(p => p.id === 'home')) add({type:'calc', id:'deposit'});
  const rz = res('resilience'); if (rz) add({type:'calc', id:rz.next.tool});
  const na = nextAssess(); if (na) add({type:'assess', id:na});
  add({type:'calc', id:'goalplanner'}); add({type:'calc', id:'networth'});
  return out.slice(0, 6);
}
function videosForYou(){
  const keys = ((res('priorities') || {}).top || []).map(p => p.id).concat((res('knowledge') || {}).learn || []).concat(['security','wealth']);
  const seen = {}; return keys.map(k => VIDEOS[k]).filter(v => v && !seen[v[0]] && (seen[v[0]] = 1)).slice(0, 4);
}

  return '<h2 class="h">Experts</h2><p class="sub">Book a free call with a qualified expert, matched by need, product and location. Your plan is shared only with your consent.</p>' + list.map(e => '<div class="card row" style="margin-bottom:8px;align-items:flex-start"><span style="font-size:26px">' + e[1] + '</span><span style="flex:1"><b style="font-size:14.5px">' + e[0] + '</b><br><span style="font-size:12.5px;color:var(--muted)">' + e[2] + '</span>' + (why(e) ? '<br>' + pill(why(e), 'teal') : '') + '</span><button class="btn sm" data-a="book" data-p="' + e[0] + '">Book</button></div>').join('') +

};
V.ask = () => {
  const inv = res('investor'), sug = ['What does ' + (inv ? inv.label : 'Balanced Builder') + ' mean?', 'Why does LifeGoals say I prefer ' + (res('mindset') ? res('mindset').label.split(' ')[0].toLowerCase() : 'security') + '?', 'How does my money mindset affect my goals?', 'Why is my risk comfort different from my capacity for loss?', 'Should I invest 70% in equities?'];
  return '<button class="back" data-a="back">‹ Back</button><h2 class="h">Ask LifeGoals</h2><p class="sub">Ask about your profile and results. LifeGoals explains; it does not recommend products or investments.</p>' +
    (S.chat.length ? '' : '<div class="sugg">' + sug.map(s => '<button data-a="askq" data-p="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>') +
    '<div>' + S.chat.map(m => '<div class="msg ' + m.who + '">' + m.t + '</div>').join('') + '</div>' + (S.chat.length ? '<div class="sugg" style="margin-top:8px">' + sug.slice(0, 4).map(s => '<button data-a="askq" data-p="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' : '') +
    '<div class="disc">AI preview: answers explain your own Discovery Profile. They are not financial advice.</div>';
};
function aiAnswer(q){
  const t = q.toLowerCase(), mm = res('mindset'), inv = res('investor'), rc = res('risk'), cp = res('capacity');
  if (/should i|% in|invest in|equities|which fund|buy /.test(t)) return 'I can’t recommend specific investments or how much to put in equities. That depends on a full suitability assessment by a qualified adviser. I can explain what your Investor Style and Risk Comfort results mean, or <b>book a call with an investment expert</b> who can advise you properly.';
  if (/capacity|different/.test(t)) return rc && cp ? 'Your <b>Risk Comfort is ' + rc.label + '</b>: that is how you <i>feel</i> about ups and downs. Your <b>Capacity for Loss is ' + cp.label + '</b>: that is how much of a fall your finances could absorb without harming important goals, based on your timeframe, cushion, income and commitments. They measure different things, so they can differ. Neither is right or wrong; together they give a more complete picture.' : 'Risk comfort is how you <i>feel</i> about losses; capacity for loss is how much your finances could actually withstand. Complete both discoveries and I can compare yours.';
  if (/security|freedom|prefer|mindset/.test(t) && mm) { const a = A('mindset'), ans = S.ans.mindset.a, key = mm.label; const picks = a.qs.map((qq, i) => qq.o[ans[i]]).filter(Boolean).slice(0, 3).map(o => '“' + o.t + '”'); return (/affect|goals/.test(t) ? 'As a <b>' + key + '</b>, LifeGoals frames your plan around what gives you confidence. ' + mm.line + ' That is why your first suggested step was <b>' + (SHORT[mm.next.tool] || mm.next.tool) + '</b>, and why ' + mm.watch.charAt(0).toLowerCase() + mm.watch.slice(1) : 'LifeGoals says you lean towards <b>' + key + '</b> because of answers like ' + picks.join(', ') + '. ' + mm.line) + (mm.sec ? ' Your secondary mindset is <b>' + mm.sec + '</b>, so you are a blend, not a box.' : ''); }
  if (/investor|builder|protector|explorer|mean/.test(t)) return inv ? '<b>' + inv.label + '</b>: ' + inv.line + ' This is an educational description of your preferences for stability, growth, access to cash and time. It is <b>not</b> an investment recommendation, and a formal risk and suitability assessment would be done by an adviser where advice is given.' : 'Take the Investor Style discovery (3 min) and I can explain your result.';
  return 'Good question. I can explain any part of your Discovery Profile, such as your money mindset, investor style, risk comfort or foundations, and how it shapes what you see in LifeGoals. For personal advice, an expert can help.';
}

function learnSheet(id){ const c = C(id), cat = CATS.find(x => x.id === c.cat); return '<div class="sheet-bg" data-a="closesheet"><div class="sheet" data-a="noop"><div class="grab"></div><h2 class="h" style="font-size:21px">' + c.em + ' About: ' + c.name + '</h2><p class="sub">' + c.q + ' This tool gives a quick, illustrative answer using a few simple assumptions, which you can change with the sliders. Real outcomes depend on rates, returns, rules and your circumstances.</p><div class="hstrip">' + videosForYou().slice(0, 3).map(vid).join('') + '</div><button class="btn dark" data-a="tab" data-p="experts" style="margin-top:12px">Talk to a ' + cat.name.toLowerCase() + ' expert</button></div></div>'; }

// ---------- render ----------
function render(scrollTop){
  const ph = document.getElementById('phone');
  const prevScroll = ph.querySelector('.scroll') ? ph.querySelector('.scroll').scrollTop : 0;
  const prevLm = ph.querySelector('#lmwrap') ? ph.querySelector('#lmwrap').scrollLeft : null;
  let html;
  if (S.quiz) html = quizHTML();
  else {
    const c = cur(), [v, p] = c.v.includes(':') ? c.v.split(':') : [c.v, c.p];
    const body = (V[v] || V.home)(p);
    html = '<div class="app"><div class="topbar"><div class="logo"><i>◔</i>LifeGoals <small>by DigiPro.AI</small></div><button class="iconbtn" data-a="go" data-p="ask">💬 Ask</button></div><div class="scroll' + (v === 'plan' ? ' flush' : '') + '">' + body + '</div><nav class="tabs" aria-label="Main">' + TABS.map(t => '<button class="' + (S.tab === t[0] ? 'on' : '') + '" data-a="tab" data-p="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + ICON[t[0]] + t[1] + '</button>').join('') + '</nav>' +
      (S.sheet ? (S.sheet.t === 'res' ? sheetHTML(S.sheet.id) : S.sheet.t === 'book' ? bookSheet(S.sheet.id) : learnSheet(S.sheet.id)) : '') + '</div>';
  }
  if (S.toast) html += '<div class="toast"><span style="font-size:20px">' + S.toast.em + '</span>' + esc(S.toast.msg) + '</div>';
  ph.innerHTML = html;
  const sc = ph.querySelector('.scroll'); if (sc && !scrollTop) sc.scrollTop = prevScroll;
  const lw = ph.querySelector('#lmwrap'); if (lw && prevLm != null && !scrollTop) lw.scrollLeft = prevLm;
  if (S.focusGoal && lw) { const g = S.goals.find(x => x.id === S.focusGoal); if (g) lw.scrollLeft = Math.max(0, ageX(g.age) - 180); S.focusGoal = null; }
  S.goals.forEach(g => delete g.isNew);
  bindCalc(); bindLifeMap(); mountPlan();
  document.querySelectorAll('.side [data-j]').forEach(b => b.classList.toggle('on', b.dataset.j === S.persona));
}
function bindCalc(){
  const c = cur(); if (S.quiz || c.v !== 'calc') return;
  const calc = C(c.p);
  document.querySelectorAll('#phone input[type=range][data-k]').forEach(inp => inp.addEventListener('input', () => {
    const v = calcVals(calc), k = inp.dataset.k; v[k] = parseFloat(inp.value);
    const def = calc.inputs.concat(calc.wi || []).find(i => i.k === k);
    document.getElementById('o-' + k).textContent = fmtIn(def, v[k]);
    document.getElementById('calcres').innerHTML = calcResultHTML(calc);
  }));
}
let PLAN_URL = null;
function mountPlan(){
  const host = document.getElementById('planhost'); if (!host) return;
  if (!PLAN_URL) { const b64 = document.getElementById('lgplan').textContent.trim(); const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0)); PLAN_URL = URL.createObjectURL(new Blob([new TextDecoder().decode(bytes)], {type:'text/html'})); }
  const f = document.createElement('iframe'); f.src = PLAN_URL; f.title = 'LifeGoals plan builder'; f.style.cssText = 'border:0;width:100%;height:100%;display:block;background:#f4f7fa'; host.appendChild(f);
}
// ---------- LifeMap drag & drop ----------
function ageFromClientX(x){ const lm = document.getElementById('lm'); const r = lm.getBoundingClientRect(); const px = (x - r.left) / r.width * LM_W; const a0 = S.user.age; return Math.max(a0, Math.min(90, Math.round(a0 + (px - 30) / (LM_W - 60) * (90 - a0)))); }
function bindLifeMap(){
  const lm = document.getElementById('lm'); if (!lm) return;
  lm.querySelectorAll('.chip').forEach(ch => ch.addEventListener('pointerdown', e => {
    e.preventDefault(); const g = S.goals.find(x => x.id === +ch.dataset.g); ch.setPointerCapture(e.pointerId); ch.classList.add('drag');
    const mv = ev => { g.age = ageFromClientX(ev.clientX); ch.style.left = ageX(g.age) + 'px'; ch.querySelector('.yr').textContent = g.age + ' · ' + (2026 + g.age - S.user.age); };
    const up = () => { ch.removeEventListener('pointermove', mv); ch.removeEventListener('pointerup', up); ch.removeEventListener('pointercancel', up); render(); };
    ch.addEventListener('pointermove', mv); ch.addEventListener('pointerup', up); ch.addEventListener('pointercancel', up);
  }));
  document.querySelectorAll('#phone .tray button[data-idea]').forEach(b => b.addEventListener('pointerdown', e => {
    e.preventDefault(); const idea = GOAL_IDEAS[+b.dataset.idea], phone = document.getElementById('phone'), pr = phone.getBoundingClientRect(), sc = pr.width / 390;
    const ghost = document.createElement('div'); ghost.className = 'chip drag'; ghost.style.position = 'absolute'; ghost.style.zIndex = 40; ghost.innerHTML = '<span>' + idea[1] + '</span>' + idea[0] + ' <span class="yr"></span>';
    phone.appendChild(ghost); let moved = false; const sx = e.clientX, sy = e.clientY;
    const place = ev => { ghost.style.left = (ev.clientX - pr.left) / sc + 'px'; ghost.style.top = ((ev.clientY - pr.top) / sc - 17) + 'px'; const lr = lm.getBoundingClientRect(); const over = ev.clientY >= lr.top && ev.clientY <= lr.bottom; ghost.querySelector('.yr').textContent = over ? 'age ' + ageFromClientX(ev.clientX) : 'drop on timeline'; };
    place(e);
    const mv = ev => { if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 6) moved = true; place(ev); };
    const up = ev => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); ghost.remove();
      const lr = lm.getBoundingClientRect(); const over = ev.clientY >= lr.top && ev.clientY <= lr.bottom && ev.clientX >= lr.left && ev.clientX <= lr.right;
      if (over || !moved) addGoal({name:idea[0], em:idea[1], amount:idea[2], age: over ? ageFromClientX(ev.clientX) : Math.min(90, S.user.age + idea[3])}, true); };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
  }));
}
function addGoal(g, stay){
  const ng = {id:gid++, name:g.name, em:g.em, amount:g.amount, age:Math.min(90, g.age), isNew:true}; S.goals.push(ng);
  checkMilestones(); if (stay) { S.focusGoal = ng.id; render(); toast(g.em + ' ' + g.name + ' added at age ' + ng.age + '. Drag to adjust.', '📍'); } return ng;
}
// ---------- actions ----------
const ACT = {
  noop(){}, back, tab:p => tab(p),
  go:p => go(p),
  quit(){ S.quiz = null; render(true); },
  startq:p => startQuiz(p),
  qnext(){ S.quiz.i = 0; render(true); },
  qprev(){ const q = S.quiz; if (q.i <= 0) q.i = -1; else q.i--; render(true); },
  qdone(){ finishQuiz(); },
  rank(p){ const q = S.quiz, i = q.rank.indexOf(p); if (i >= 0) q.rank.splice(i, 1); else if (q.rank.length < 5) q.rank.push(p); render(); },
  ans(p){ const q = S.quiz, a = A(q.id); q.a[q.i] = +p; if (a.kind === 'kc') { render(); return; } render(); setTimeout(() => { if (!S.quiz) return; if (q.i < a.qs.length - 1) { q.i++; render(true); } else finishQuiz(); }, 260); },
  conf(p){ const q = S.quiz, a = A(q.id); q.conf[q.i] = +p; render(); setTimeout(() => { if (!S.quiz) return; if (q.i < a.qs.length - 1) { q.i++; render(true); } else finishQuiz(); }, 260); },
  result:p => { S.sheet = null; if (S.tab !== 'um') { S.tab = 'um'; S.stack = [{v:'um'}]; } go('result', p); },
  sheet:p => { S.sheet = {t:'res', id:p}; render(); },
  closesheet(){ S.sheet = null; render(); },
  calc:p => { S.sheet = null; go('calc', p); },
  seg:p => { S.seg = p; render(true); },
  addgoal(p){ const c = C(p), r = c.run(calcVals(c)); if (!r.goal) { toast('This result doesn’t create a goal. Save it instead.', 'ℹ️'); return; } const g = addGoal({name:r.goal.name, em:r.goal.em, amount:r.goal.amount, age:S.user.age + r.goal.years}); S.ms.calcAdded = true; checkMilestones(); go('added', g.id); },
  saveres(p){ const c = C(p), r = c.run(calcVals(c)); S.saved.unshift({id:p, name:c.name, em:c.em, lbl:r.lbl, val:r.val, date:TODAY}); toast('Result saved to My Life → Goals', '💾'); },
  scrollwi(){ const w = document.getElementById('wi'); if (w) w.scrollIntoView({behavior:'smooth'}); },
  learn:p => { S.sheet = {t:'learn', id:p}; render(); },
  seegoal(){ const g = cur().p; S.seg = 'map'; S.focusGoal = g; tab('mylife'); },
  delgoal(p){ S.goals = S.goals.filter(g => g.id !== +p); render(); },
  book:p => { S.sheet = {t:'book', id:p}; render(); },
  confirmbook(){ S.sheet = null; render(); toast('You’re booked in. Confirmation sent by email.', '📅'); },
  remind(){ toast('We’ll remind you before it starts', '🔔'); },
  askq(p){ S.chat.push({who:'me', t:esc(p)}, {who:'ai', t:aiAnswer(p)}); render(); setTimeout(() => { const s = document.querySelector('#phone .scroll'); if (s) s.scrollTop = s.scrollHeight; }, 30); },
  askabout(p){ const r = res(p); const qs = {investor:'What does ' + r.label + ' mean?', mindset:'Why does LifeGoals say I prefer ' + r.label.split(' ')[0].toLowerCase() + '?', risk:'Why is my risk comfort different from my capacity for loss?', capacity:'Why is my risk comfort different from my capacity for loss?'}; go('ask'); ACT.askq(qs[p] || 'What does my ' + A(p).name.toLowerCase() + ' result mean?'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('#phone [data-a]'); if (!el) return;
  if (el.dataset.a === 'closesheet' && e.target.closest('.sheet')) return;
  e.preventDefault(); const f = ACT[el.dataset.a]; if (f) f(el.dataset.p);

// ---------- side panel ----------
const JUMPS = [['Understand Me','tab','um'],['My Financial Profile','go','profile'],['Profile progress','go','progress'],['Money Mindset','startq','mindset'],['Risk Comfort','startq','risk'],['What Matters to Me','startq','priorities'],['Tools & Calculators','go','tools'],['Retirement calculator','calc','retirement'],['Emergency fund calculator','calc','emergency'],['LifeMap (drag & drop)','tab','mylife'],['Ask LifeGoals','go','ask'],['Home (personalised)','tab','home'],['LifeGoals plan builder','go','plan']];
function side(){

  });
}
function fit(){ const w = document.getElementById('wrap'), small = innerWidth <= 780; const s = small ? Math.min(innerWidth / 390, innerHeight / 844) : Math.min(1, (innerHeight - 40) / 844, (innerWidth - 330) / 420); w.style.transform = 'scale(' + Math.max(.35, s) + ')'; }
