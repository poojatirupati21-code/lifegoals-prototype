<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeGoals Adviser</title>
<meta name="description" content="Calm, app-like adviser portal prototype for LifeGoals: guided onboarding, a Today home, match cards, client journeys and focused meeting sessions with live notes.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app-like single column (max 1040px). Desktop: top bar with 4 tabs. Phone: bottom tab bar.
   Onboarding and client sessions open as full-screen calm scenes, one decision per screen. */
:root{
  --ink:#0B2545;--ink2:#13315C;--night:#081A33;--muted:#5A6B82;--line:#E1E8EE;--bg:#F2F6F5;--card:#FFFFFF;
  --sea:#0F9D8F;--sea-d:#0B7A70;--sea-l:#D9F2EE;--sun:#F2B134;--sun-l:#FDF0D2;--coral:#E8674A;--sky:#4E9BD8;--storm:#5E548E;--mint:#6BE3D3;
  --good-t:#09685F;--good-l:#D9F2EE;--nudge-t:#7A5200;--nudge-l:#FDF0D2;--alert-t:#B23A1F;--alert-l:#FBE4DD;
  --on-dark:#FFFFFF;--on-dark2:#B8C6D9;--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);
  --fh:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.015em;text-wrap:balance}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* top bar + tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(242,246,245,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:800;font-size:19px}
.logo small{font-family:var(--fb);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-d)}
.tabs{display:flex;gap:4px;margin:0 auto}
.tab{border:0;background:none;padding:8px 14px;border-radius:30px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;position:relative}
.tab:hover{background:var(--card)}
.tab.on{background:var(--ink);color:var(--on-dark)}
.tab svg{width:20px;height:20px}
.tab .bd{position:absolute;top:3px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--on-dark);background:var(--sea);flex-shrink:0;border:0}
main.page{max-width:1040px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:26px}

/* type */
.hello{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello h1{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.05}
.hello p{margin:4px 0 0;color:var(--muted)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec h2{font-size:20px;font-weight:700}
.sec .link{font-size:14px}
.muted{color:var(--muted)}.small{font-size:13px}
.link{align-self:flex-start;border:0;background:none;padding:0;color:var(--sea-d);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* buttons, chips */
.btn{border:0;border-radius:40px;padding:12px 22px;min-height:46px;font-weight:800;background:var(--ink);color:var(--on-dark);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--ink2)}
.btn.sun{background:var(--sun);color:var(--ink)}.btn.sun:hover{background:#E5A320}
.btn.sea{background:var(--sea-d);color:var(--on-dark)}.btn.sea:hover{background:var(--good-t)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.ghost:hover{background:var(--glass)}
.btn.white{background:var(--on-dark);color:var(--ink)}
.btn.sm{min-height:36px;padding:7px 15px;font-size:13.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.p-good{background:var(--good-l);color:var(--good-t)}.p-nudge{background:var(--nudge-l);color:var(--nudge-t)}.p-alert{background:var(--alert-l);color:var(--alert-t)}
.p-glass{background:var(--glass2);color:var(--on-dark)}
.p-ink{background:var(--ink);color:var(--on-dark)}

/* artwork cards (Insight Timer style imagery, drawn with gradients) */
.art{position:relative;border-radius:22px;overflow:hidden;color:var(--on-dark);isolation:isolate}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,26,51,0) 30%,rgba(8,26,51,.55));z-index:-1}
.hero{min-height:250px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.hero .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero h2{font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.05}
.hero p{margin:0;color:var(--on-dark2);max-width:52ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.duo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}

/* shelves */
.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px}
.shelf::-webkit-scrollbar{height:6px}.shelf::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.tile{flex:0 0 220px;scroll-snap-align:start;border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:8px}
.tile .art{height:150px;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:15px}
.tile span.m{font-size:13px;color:var(--muted)}
.tile:hover .art{transform:translateY(-2px)}
@media (prefers-reduced-motion:no-preference){.tile .art,.mcard{transition:transform .2s}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.stat b{font-family:var(--fh);font-size:26px;font-weight:800;display:block;line-height:1}
.stat span{font-size:13px;color:var(--muted)}

/* journey ring */
.ring{flex-shrink:0}

/* list rows */
.list{background:var(--card);border-radius:22px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:hover{background:#F8FBFA}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.li .t span{font-size:13px;color:var(--muted)}
.thumb{width:52px;height:52px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:var(--on-dark);font-size:15px}
.chev{color:var(--muted);font-size:20px}

/* match card */
.mcard{border-radius:24px;overflow:hidden;background:var(--card);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.mcard .art{border-radius:0;padding:22px;display:flex;flex-direction:column;justify-content:space-between;min-height:260px}
.mcard .fit{font-family:var(--fh);font-size:46px;font-weight:800;line-height:1}
.mcard .fit small{display:block;font-family:var(--fb);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.8}
.mcard .bd{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{font-size:12.5px;font-weight:700;border-radius:10px;padding:5px 10px;background:var(--sea-l);color:var(--good-t)}
.why span.x{background:var(--alert-l);color:var(--alert-t)}
.gl{display:flex;flex-direction:column;gap:8px}
.g{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:10px;align-items:center;font-size:14px}
.meter{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px}
.flag{background:#EFEAF8;color:var(--storm);border-radius:14px;padding:10px 12px;font-size:13.5px}
.flag b{display:block}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}

/* client page */
.chero{min-height:220px;padding:22px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.chero h1{font-size:clamp(26px,4vw,38px);font-weight:800}
.chero p{margin:2px 0 0;color:var(--on-dark2)}
.chapters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chap{border-radius:16px;padding:12px;background:var(--card);font-size:13px}
.chap b{display:block;font-size:14px}
.chap .n{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chap.done{background:var(--sea-l)}.chap.done .n{color:var(--good-t)}
.chap.now{background:var(--ink);color:var(--on-dark)}.chap.now .n{color:var(--sun)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gcard{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.gcard .pc{font-family:var(--fh);font-size:30px;font-weight:800;line-height:1}
.check{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;accent-color:var(--sea-d);flex-shrink:0}
.check .t{flex:1;min-width:0}.check .t span{display:block;font-size:13px;color:var(--muted)}
.check.done .t b{text-decoration:line-through;color:var(--muted)}

/* scenes: onboarding + session (full-screen, calm, dark) */
.scene{position:fixed;inset:0;z-index:20;color:var(--on-dark);background:var(--night);display:flex;flex-direction:column;overflow:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.scene .sky{position:fixed;inset:0;z-index:-1;pointer-events:none}
.scene-top{display:flex;align-items:center;gap:12px;padding:16px;max-width:1040px;width:100%;margin:0 auto}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--glass2)}
.prog i.d{background:var(--sun)}
.xbtn{border:0;background:var(--glass);color:var(--on-dark);width:40px;height:40px;border-radius:50%;font-size:18px;flex-shrink:0}
.xbtn:hover{background:var(--glass2)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;width:100%;margin:0 auto;padding:12px 16px 28px;gap:18px}
.stage h1{font-size:clamp(30px,5vw,46px);font-weight:800;line-height:1.05}
.stage .lead{color:var(--on-dark2);font-size:17px;margin:0;max-width:52ch}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:0;border-radius:18px;padding:14px 16px;background:var(--glass);color:var(--on-dark);text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--glass2)}
.opt:hover{background:var(--glass2)}
.opt b{font-size:15px}.opt span{font-size:12.5px;color:var(--on-dark2)}
.opt.sel{background:var(--on-dark);color:var(--ink);box-shadow:none}
.opt.sel span{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--on-dark2)}
.field input{border:0;border-radius:14px;padding:13px 14px;background:var(--glass);color:var(--on-dark);box-shadow:inset 0 0 0 1.5px var(--glass2);font-size:16px;font-weight:600}
.field input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--sun)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ok{background:rgba(107,227,211,.14);color:var(--mint);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.doc{border:0;border-radius:16px;padding:14px;background:var(--glass);color:var(--on-dark);text-align:left;box-shadow:inset 0 0 0 1.5px dashed var(--glass2);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-size:13.5px}
.doc.up{background:rgba(107,227,211,.14);box-shadow:none}
.doc .st{font-size:12px;font-weight:800;color:var(--sun)}
.doc.up .st{color:var(--mint)}
.next{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:16px;background:var(--glass);border-radius:40px;padding:6px}
.step button{border:0;width:44px;height:44px;border-radius:50%;background:var(--glass2);color:var(--on-dark);font-size:20px;font-weight:800}
.step b{font-family:var(--fh);font-size:30px;min-width:40px;text-align:center}
.story{border-radius:26px;min-height:230px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.story h2{font-size:26px}
.story p{margin:0;color:var(--on-dark2)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--glass2)}.dots i.on{background:var(--sun);width:22px;border-radius:5px}
.pcard{border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:8px}
.tagr{display:flex;flex-wrap:wrap;gap:6px}
.tagr span{font-size:12px;font-weight:700;border-radius:10px;padding:4px 9px;background:var(--glass2)}

/* session */
.sgrid{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;max-width:1040px;width:100%;margin:0 auto;padding:4px 16px 24px}
.spanel{display:flex;flex-direction:column;gap:16px;justify-content:flex-start;padding-top:5vh;min-width:0}
.timer{font-family:var(--fh);font-weight:700;font-size:15px;color:var(--on-dark2)}
.chaps{display:flex;gap:6px;flex-wrap:wrap}
.chaps span{font-size:12.5px;font-weight:700;border-radius:30px;padding:5px 12px;background:var(--glass);color:var(--on-dark2)}
.chaps span.on{background:var(--sun);color:var(--ink)}
.chaps span.d{background:rgba(107,227,211,.16);color:var(--mint)}
.fact{border-radius:26px;padding:26px;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--glass2);display:flex;flex-direction:column;gap:10px}
.fact .v{font-family:var(--fh);font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1}
.fact .k{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark2)}
.tg{align-self:flex-start}
.tg.estimated{background:var(--sun-l);color:var(--nudge-t)}.tg.missing{background:var(--alert-l);color:var(--alert-t)}.tg.conflicting{background:#EFEAF8;color:var(--storm)}.tg.outdated{background:#E1EFFA;color:#1F5F92}
.notes{border-radius:22px;background:var(--glass);padding:18px;display:flex;flex-direction:column;gap:10px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}
.notes h3{font-size:15px;display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--coral)}
@media (prefers-reduced-motion:no-preference){.live{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.3}}}
.note{font-size:13.5px;color:var(--on-dark2);padding-left:12px;border-left:2px solid var(--glass2)}
.note b{color:var(--on-dark)}
.tip{background:rgba(242,177,52,.14);color:var(--sun);border-radius:14px;padding:10px 12px;font-size:13.5px}
.tip b{display:block}
.sg{display:grid;grid-template-columns:minmax(0,1fr) 70px 44px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--glass2);font-size:14px}
.sg:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:var(--sun)}
.big{font-family:var(--fh);font-size:40px;font-weight:800}
.recs{display:flex;flex-direction:column;gap:8px}

/* celebrate + toast */
.cele{position:fixed;inset:0;z-index:40;background:rgba(8,26,51,.82);display:grid;place-items:center;padding:16px;color:var(--on-dark);text-align:center}
.cele .box{max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cele h2{font-size:30px}
.cele p{margin:0;color:var(--on-dark2)}
.burst{width:120px;height:120px}
@media (prefers-reduced-motion:no-preference){.burst circle.r{stroke-dasharray:340;stroke-dashoffset:340;animation:draw .9s ease-out forwards}.burst path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .6s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--on-dark);padding:12px 18px;border-radius:40px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(8,26,51,.3);max-width:calc(100% - 32px);text-align:center}

/* phone */
@media (max-width:760px){
  .bar{backdrop-filter:none;background:var(--bg)}
  .bar .tabs{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 10px}
  .tab.on{background:none;color:var(--ink)}.tab.on svg{color:var(--sea-d)}
  .bar-in{justify-content:space-between}
  main.page{padding-bottom:100px}
  .duo,.mcard,.sgrid{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:minmax(0,1fr)}
  .chapters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts,.docs{grid-template-columns:minmax(0,1fr)}
  .notes{max-height:none}
}
</style>

<div id="root"></div>

<script>
const PAL = [['#0F9D8F','#0B2545','#F2B134'],['#4E9BD8','#13315C','#6BE3D3'],['#E8674A','#5E548E','#F2B134'],['#5E548E','#081A33','#4E9BD8'],['#F2B134','#E8674A','#13315C'],['#6BE3D3','#0B7A70','#13315C']];
const art = i => { const [a, b, c] = PAL[i % PAL.length]; return 'background:radial-gradient(circle at 82% 18%,' + c + ' 0 14%,transparent 15%),radial-gradient(120% 90% at 0% 100%,' + a + ' 0%,transparent 60%),radial-gradient(90% 80% at 100% 100%,' + c + '55 0%,transparent 55%),linear-gradient(160deg,' + b + ',' + a + ')'; };
const SKY = 'background:radial-gradient(60% 50% at 85% 0%,rgba(15,157,143,.45),transparent 70%),radial-gradient(50% 45% at 0% 100%,rgba(94,84,142,.55),transparent 70%),radial-gradient(30% 30% at 70% 85%,rgba(242,177,52,.18),transparent 70%),#081A33';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => '€' + Math.round(n).toLocaleString('en-IE');
const R = 0.035;
const pct = (g, extra) => { const y = g.yrs, k = Math.pow(1 + R, y); return Math.min(100, Math.round((g.have * k + (g.m + (extra || 0)) * 12 * ((k - 1) / R)) / g.amt * 100)); };
const band = p => p >= 90 ? ['good','On track','#0F9D8F'] : p >= 65 ? ['nudge','Needs a nudge','#F2B134'] : ['alert','At risk','#E8674A'];
const CH = ['Verify','Plan & agree','Implement','Review'];
const STG = {verify:0, plan:1, implement:2, review:3};

/* journey ring: 4 arcs for Verify, Plan, Implement, Review */
function ring(stage, size, dark){
  const s = size || 44, r = s / 2 - 4, C = 2 * Math.PI * r, seg = C / 4, gap = 4, ix = STG[stage];
  let h = '<svg class="ring" width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" aria-label="Chapter ' + (ix + 1) + ' of 4: ' + CH[ix] + '" role="img">';
  for (let i = 0; i < 4; i++) { const col = i < ix ? '#0F9D8F' : i === ix ? '#F2B134' : (dark ? 'rgba(255,255,255,.22)' : '#E1E8EE');
    h += '<circle cx="' + s / 2 + '" cy="' + s / 2 + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (seg - gap) + ' ' + (C - seg + gap) + '" stroke-dashoffset="' + (-i * seg + C / 4) + '"/>'; }
  return h + '<text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="' + (s / 3.4) + '" font-weight="800" fill="' + (dark ? '#FFFFFF' : '#0B2545') + '">' + (ix + 1) + '</text></svg>';
}

  if (m.st === 'new') acts = S.pass === m.id ? '<div style="width:100%"><b>What\'s the reason?</b> <span class="small muted">The client isn\'t told.</span><div class="why" style="margin-top:8px">' + ['No space right now','Outside my expertise','Possible conflict','Too far away'].map(r => '<button class="btn ghost sm" data-a="passWhy" data-p="' + m.id + '">' + r + '</button>').join('') + '</div></div>'
    : '<button class="btn sea" data-a="accept" data-p="' + m.id + '">Accept</button><button class="btn ghost" data-a="pass" data-p="' + m.id + '">Pass</button>';
  else acts = '<span class="pill p-nudge">⏳ Asking them to share their full report with you…</span>';
  return '<article class="mcard"><div class="art" style="' + art(m.art) + '"><div><span class="pill p-glass">' + m.code + '</span></div><div><div class="fit num">' + m.fit + '%<small>Match fit</small></div><h2 style="font-size:24px;margin-top:10px">' + m.need + '</h2><div style="color:var(--on-dark2);font-size:14px">' + m.age + ' · ' + m.area + ' · prefers ' + m.pref + '</div></div></div>' +
    '<div class="bd"><div class="why">' + m.why.map(([t, ok]) => '<span class="' + (ok ? '' : 'x') + '">' + (ok ? '✓ ' : '! ') + t + '</span>').join('') + '</div>' +
    '<div class="gl">' + goals.map(([n, p]) => '<div class="g"><span>' + n + '</span><div class="meter"><i style="width:' + p + '%;background:' + band(p)[2] + '"></i></div><b class="num" style="text-align:right">' + p + '%</b></div>').join('') + '</div>' +
    (flag ? '<div class="flag"><b>' + flag[0] + '</b>' + flag[1] + '</div>' : '') + '<div class="small muted">Data: ' + m.ready + '</div><div class="acts">' + acts + '</div></div></article>';
}

/* ---------- Clients ---------- */
function clientsPage(){
  return '<div class="hello"><div><h1>Clients</h1><p>Every client moves through four chapters: verify, plan &amp; agree, implement, review.</p></div></div>' +
    '<div class="list">' + active().map(c => '<button class="li" data-a="client" data-p="' + c.id + '"><span class="thumb" style="' + art(c.art) + '">' + c.ini + '</span><span class="t"><b>' + esc(c.name) + '</b><span>' + CH[STG[c.stage]] + ' · ' + nextStep(c) + '</span></span>' + ring(c.stage, 44) + '<span class="chev">›</span></button>').join('') + '</div>';
}
function clientPage(){
  const c = C(S.cid), ix = STG[c.stage];
  const cta = c.stage === 'implement' ? '' : c.stage === 'plan' && c.sent ? '<span class="pill p-glass">⏳ Waiting for ' + esc(c.first) + ' to approve</span>' : '<button class="btn sun" data-a="session" data-p="' + c.id + '">▶ ' + (c.stage === 'verify' ? 'Start verification' : c.stage === 'plan' ? 'Start plan session' : 'Start review') + '</button>';
  let block = '';
  if (c.stage === 'implement') { const left = c.actions.filter(a => !a.done).length;
    block = '<section><div class="sec"><h2>Put the plan into action</h2><span class="muted small">' + (c.actions.length - left) + ' of ' + c.actions.length + ' done</span></div><div class="list">' + c.actions.map((a, i) => '<label class="check' + (a.done ? ' done' : '') + '"><input type="checkbox" id="act-' + c.id + '-' + i + '" data-a="act" data-p="' + i + '"' + (a.done ? ' checked' : '') + '><span class="t"><b>' + esc(a.t) + '</b><span>' + esc(a.who) + ' · ' + a.due + '</span></span></label>').join('') + '</div>' +
      '<div style="margin-top:12px"><button class="btn sea" data-a="implemented"' + (left ? ' disabled' : '') + '>Tell LifeGoals it\'s implemented</button>' + (left ? ' <span class="small muted">Tick every action first.</span>' : '') + '</div></section>'; }
  if (c.events.length) block += '<section><div class="sec"><h2>What changed</h2></div><div class="list">' + c.events.map(e => '<div class="li"><span class="thumb" style="' + art(4) + '">!</span><span class="t"><b>' + esc(e.t) + '</b><span>Reported ' + e.d + '</span></span></div>').join('') + '</div></section>';
  return '<button class="link" data-a="back">‹ Back</button><div class="art chero" style="' + art(c.art) + '">' + ring(c.stage, 76, true) + '<div style="flex:1;min-width:200px"><h1>' + esc(c.name) + '</h1><p>' + c.age + ' · ' + esc(c.loc) + ' · ' + esc(c.hh) + '</p></div>' + cta + '</div>' +
    '<div class="chapters">' + CH.map((t, i) => '<div class="chap' + (i < ix ? ' done' : i === ix ? ' now' : '') + '"><span class="n">' + (i < ix ? '✓ Done' : i === ix ? 'Now' : 'Chapter ' + (i + 1)) + '</span><b>' + t + '</b></div>').join('') + '</div>' + block +
    '<section><div class="sec"><h2>Goals</h2><span class="muted small">Projected at 3.5% a year</span></div><div class="gcards">' + c.goals.map(g => { const p = pct(g, c.extra / c.goals.length), b = band(p); return '<div class="gcard"><span class="pill p-' + b[0] + '" style="align-self:flex-start">' + b[1] + '</span><span class="pc num">' + p + '%</span><b>' + esc(g.n) + '</b><span class="small muted num">' + eur(g.amt) + ' by age ' + (c.age + g.yrs) + '</span><div class="meter"><i style="width:' + p + '%;background:' + b[2] + '"></i></div></div>'; }).join('') + '</div></section>';
}

/* ---------- Me ---------- */
function mePage(){
  const m = S.me;
  return '<div class="hello"><div><h1>Me</h1><p>Your profile, availability and guides.</p></div></div><div class="duo"><div>' + profileCard() + '</div>' +
    '<div class="list"><div class="li"><span class="t"><b>New clients a month</b><span>Matches pause at this number</span></span><button class="btn ghost sm" data-a="capMe" data-p="-1" aria-label="Fewer">−</button><b class="num">' + m.cap + '</b><button class="btn ghost sm" data-a="capMe" data-p="1" aria-label="More">+</button></div>' +
    '<div class="li"><span class="t"><b>Free times</b><span>' + m.when.join(', ') + '</span></span></div><div class="li"><span class="t"><b>Meetings</b><span>' + m.modes.join(', ') + '</span></span></div>' +
    '<div class="li"><span class="t"><b>Central Bank reference</b><span>' + esc(m.cbi) + ' · verified</span></span><span class="pill p-good">✓</span></div>' +
    '<button class="li" data-a="restart"><span class="t"><b>Restart the prototype</b><span>Go back to the first onboarding screen</span></span><span class="chev">›</span></button></div></div>' +
    '<section><div class="sec"><h2>Guides</h2></div><div class="shelf">' + GUIDES.map(([id, t, min, a]) => '<button class="tile" data-a="toast" data-p="Guide opens here: ' + t + '"><div class="art" style="' + art(a) + '"><span class="pill p-glass">' + min + '</span></div><b>' + t + '</b></button>').join('') + '</div></section>';
}

/* ---------- Session: focused meeting with live notes ---------- */
function startSession(id){
  const c = C(id), type = c.stage === 'verify' ? 'verify' : 'plan';
  S.sess = {cid:id, type, ch:0, fi:0, t0:Date.now(), suit:{}, notes:[['Session started', c.mode + ' with ' + c.first]]};
}
function sessionScene(){
  const s = S.sess, c = C(s.cid), chs = s.type === 'verify' ? ['Check in','Confirm facts','Wrap up'] : ['Check in','Explore','Recommend','Wrap up'];
  const ch = chs[s.ch], last = s.ch === chs.length - 1;
  let main = '';
  if (ch === 'Check in') main = '<div class="kicker">' + (s.type === 'verify' ? 'Verification' : c.stage === 'review' ? 'Review' : 'Plan meeting') + ' · ' + esc(c.name) + '</div><h1>Start by asking what matters most to ' + esc(c.first) + ' right now.</h1>' +
    (c.asks ? '<p class="lead">' + esc(c.first) + ' wants to ask: “' + c.asks.join('” and “') + '”</p>' : '') + (c.events.length ? '<p class="lead">Since the last review: ' + esc(c.events[0].t) + '.</p>' : '') +
    (c.flag ? '<div class="tip"><b>' + c.flag[0] + '</b>' + c.flag[1] + '</div>' : '') + '<div class="next"><button class="btn sun" data-a="chNext">Begin →</button></div>';
  else if (ch === 'Confirm facts') { const open = c.facts.filter(f => f.tag !== 'verified' && f.tag !== 'requested'), f = open[0];
    main = f ? '<div class="kicker">' + open.length + ' left to check together</div><div class="fact"><span class="k">' + f.k + '</span><span class="v num">' + f.v + '</span><span class="pill tg ' + f.tag + '">' + f.tag[0].toUpperCase() + f.tag.slice(1) + '</span><span style="color:var(--on-dark2)">' + esc(f.src) + '</span></div>' +
      '<div class="next"><button class="btn sun" data-a="fact" data-p="ok">✓ Confirmed with ' + esc(c.first) + '</button><button class="btn ghost" data-a="fact" data-p="doc">Ask for a document</button></div>'
      : '<h1>Every fact is checked.</h1><p class="lead">Documents you asked for will arrive in ' + esc(c.first) + '\'s secure portal.</p><div class="next"><button class="btn sun" data-a="chNext">Wrap up →</button></div>'; }
  else if (ch === 'Explore') main = '<div class="kicker">Explore together</div><h1>What if ' + esc(c.first) + ' saved a little more each month?</h1>' +
    '<div><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--on-dark2)">Extra each month</span><span class="big num" id="xv">' + eur(c.extra) + '</span></div><input type="range" id="extra" min="0" max="800" step="25" value="' + c.extra + '" data-a="extra" aria-label="Extra monthly saving"></div>' +
    '<div id="sgl">' + sGoals(c) + '</div><div class="next"><button class="btn sun" data-a="chNext">Looks right →</button></div>';
  else if (ch === 'Recommend') { const suit = [['needs','Needs and goals recorded'],['risk','Risk matches discovery'],['loss','Capacity for loss checked'],['fees','Fees disclosed']], allS = suit.every(([k]) => s.suit[k]);
    main = '<div class="kicker">Recommend</div><h1>What do you recommend?</h1><div class="opts">' + c.recOpts.map(r => '<button class="opt' + (c.recs.includes(r) ? ' sel' : '') + '" data-a="rec" data-p="' + esc(r) + '"><b>' + esc(r) + '</b></button>').join('') + '</div>' +
      '<div><div class="small" style="color:var(--on-dark2);font-weight:700;margin-bottom:8px">Suitability, you own this</div><div class="why">' + suit.map(([k, l]) => '<button class="btn sm ' + (s.suit[k] ? 'white' : 'ghost') + '" data-a="suit" data-p="' + k + '">' + (s.suit[k] ? '✓ ' : '') + l + '</button>').join('') + '</div></div>' +
      '<div class="next"><button class="btn sun" data-a="chNext"' + (c.recs.length && allS ? '' : ' disabled') + '>Wrap up →</button></div>'; }
  else if (last) { const pts = s.type === 'verify' ? [c.facts.filter(f => f.tag === 'verified').length + ' facts confirmed', c.facts.filter(f => f.tag === 'requested').length + ' documents requested', 'Plan meeting booked for Fri 16 Oct · 10:00']
      : [c.recs.length + ' recommendations agreed: ' + c.recs.join(', '), 'Extra saving of ' + eur(c.extra) + ' a month modelled', 'Suitability record complete'];
    main = '<div class="kicker">Wrap up · drafted from your session</div><h1>Here\'s the summary for ' + esc(c.first) + '.</h1><div class="fact" style="gap:8px">' + pts.map(p => '<div>✓ ' + esc(p) + '</div>').join('') + '</div>' +
      '<div class="next"><button class="btn sun" data-a="endSession">' + (s.type === 'verify' ? 'Save and finish' : 'Send plan to ' + esc(c.first)) + '</button><button class="btn ghost" data-a="chBack">Back</button></div>'; }
  const mins = Math.floor((Date.now() - s.t0) / 60000), secs = Math.floor((Date.now() - s.t0) / 1000) % 60;
  return '<div class="scene" role="dialog" aria-label="Client session"><div class="sky" style="' + SKY + '"></div><div class="scene-top"><button class="xbtn" data-a="endEarly" aria-label="Leave session">×</button>' +
    '<div class="chaps">' + chs.map((t, i) => '<span class="' + (i < s.ch ? 'd' : i === s.ch ? 'on' : '') + '">' + (i < s.ch ? '✓ ' : '') + t + '</span>').join('') + '</div><span style="flex:1"></span><span class="timer num" id="timer">' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '</span></div>' +
    '<div class="sgrid"><div class="spanel">' + main + '</div><aside class="notes" aria-label="Live notes"><h3><span class="live"></span>Live notes</h3>' + s.notes.slice().reverse().map(([b, t]) => '<div class="note"><b>' + esc(b) + '</b><br>' + esc(t) + '</div>').join('') +
    (c.facts.some(f => f.k === 'Income protection' && f.tag === 'missing') ? '<div class="tip"><b>Suggested question</b>No income protection on file. Ask how ' + esc(c.first) + ' would cope without income for six months.</div>' : '') + '</aside></div></div>';
}
function sGoals(c){ return c.goals.map(g => { const p = pct(g, c.extra / c.goals.length), was = pct(g, 0), b = band(p); return '<div class="sg"><span><b>' + esc(g.n) + '</b><br><span style="color:var(--on-dark2);font-size:12.5px">was ' + was + '%</span></span><div class="meter" style="background:var(--glass2)"><i style="width:' + p + '%;background:' + b[2] + '"></i></div><b class="num" style="text-align:right">' + p + '%</b></div>'; }).join(''); }

/* ---------- render ---------- */
function celebrate(){ if (!S.cele) return ''; const [t, d, btn] = S.cele;
  return '<div class="cele" role="alertdialog" aria-label="' + esc(t) + '"><div class="box"><svg class="burst" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="8"/><circle class="r" cx="60" cy="60" r="54" fill="none" stroke="#F2B134" stroke-width="8" stroke-linecap="round" transform="rotate(-90 60 60)"/><path d="M38 62l15 15 30-32" fill="none" stroke="#6BE3D3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>' + t + '</h2><p>' + d + '</p><button class="btn sun" data-a="celeOk">' + (btn || 'Lovely') + '</button></div></div>'; }
function render(){
  const root = document.getElementById('root');
  let h;
  if (S.view === 'onboard') h = onboard();
  else { h = shell(S.cid ? clientPage() : {today, match:matchesPage, clients:clientsPage, me:mePage}[S.tab]()); if (S.sess) h += sessionScene(); }
  root.innerHTML = h + celebrate() + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '');
}
let tt;
const toast = t => { S.toast = t; clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 2600); };
const note = (b, t) => S.sess.notes.push([b, t]);
const later = (ms, fn) => setTimeout(() => { fn(); render(); }, ms);

const A = {
  obNext: () => { S.ob = Math.min(OB.length - 1, S.ob + 1); }, obBack: () => { S.ob = Math.max(0, S.ob - 1); },
  skip: () => { S.view = 'app'; S.ob = OB.length - 1; Object.keys(S.me.docs).forEach(k => S.me.docs[k] = true); },
  finish: () => { S.view = 'app'; S.tab = 'match'; window.scrollTo(0, 0); },
  doc: p => { S.me.docs[p] = true; }, guide: p => { S.me.guide[p] = true; },
  pick: p => { const [k, v] = p.split('|'), a = S.me[k], i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); },
  one: p => { const [k, v] = p.split('|'); S.me[k] = v; },
  cap: p => { S.me.cap = Math.max(1, Math.min(15, S.me.cap + +p)); }, capMe: p => A.cap(p),
  tab: p => { S.tab = p; S.cid = null; window.scrollTo(0, 0); }, back: () => { S.cid = null; },
  client: p => { S.cid = p; window.scrollTo(0, 0); },
  toast: p => toast(p), restart: () => reset(),
  accept: p => { const m = S.matches.find(x => x.id === p); m.st = 'pending';
    later(1800, () => { m.st = 'gone'; const id = m.cid; if (!S.order.includes(id)) S.order.unshift(id); S.cele = [C(id).first + ' said yes', 'Their LifeMap, report and documents are now in your clients. Your first meeting is ' + C(id).next + '.', 'Open ' + C(id).first + '\'s file']; S.celeGo = id; }); },
  pass: p => { S.pass = p; },
  passWhy: p => { S.matches.find(x => x.id === p).st = 'gone'; S.pass = null; toast('Passed. LifeGoals will offer them the next adviser.'); },
  celeOk: () => { S.cele = null; if (S.celeGo) { S.cid = S.celeGo; S.celeGo = null; window.scrollTo(0, 0); } },
  session: p => { startSession(p); },
  chNext: () => { S.sess.ch++; }, chBack: () => { S.sess.ch--; },
  endEarly: () => { S.sess = null; toast('Session paused. Pick up where you left off any time.'); },
  fact: p => { const c = C(S.sess.cid), f = c.facts.find(x => x.tag !== 'verified' && x.tag !== 'requested') ; if (!f) return;
    if (p === 'ok') { note('Confirmed: ' + f.k, f.v + (f.tag === 'conflicting' ? ' (client confirmed the statement figure)' : '')); f.tag = 'verified'; }
    else { note('Document requested', f.k + ': sent to ' + c.first + '\'s secure portal'); f.tag = 'requested'; } },
  extra: (p, el) => { const c = C(S.sess.cid); c.extra = +el.value; document.getElementById('xv').textContent = eur(c.extra); document.getElementById('sgl').innerHTML = sGoals(c); return false; },
  rec: p => { const c = C(S.sess.cid), i = c.recs.indexOf(p); if (i < 0) { c.recs.push(p); note('Recommended', p); } else c.recs.splice(i, 1); },
  suit: p => { S.sess.suit[p] = !S.sess.suit[p]; },
  endSession: () => { const s = S.sess, c = C(s.cid); S.sess = null;
    if (s.type === 'verify') { c.stage = 'plan'; c.next = 'Fri 16 Oct · 10:00'; c.mode = 'In person'; S.cele = ['Profile verified', c.first + '\'s financial picture is confirmed. Your plan meeting is booked for Fri 16 Oct.']; }
    else { c.sent = true; c.stage = 'plan'; c.events = []; toast('Plan sent. ' + c.first + ' will get a notification.');
      later(3500, () => { c.sent = false; c.stage = 'implement'; c.actions = c.recs.map(r => ({t:r, who:'You and ' + c.first, due:'by 30 Oct', done:false})); S.helped++; S.cele = [c.first + ' approved the plan', 'That\'s ' + S.helped + ' families with an agreed plan. Actions are ready to track.', 'See actions']; S.celeGo = c.id; }); } },
  act: (p, el) => { C(S.cid).actions[+p].done = el.checked; },
  implemented: () => { const c = C(S.cid); c.stage = 'review'; c.next = 'Review due Apr 2027'; S.cele = ['Plan implemented', 'LifeGoals will track progress and remind you both before the April review.']; }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled || (el.tagName === 'INPUT' && el.type === 'range')) return;
  const fn = A[el.dataset.a]; if (fn && fn(el.dataset.p, el) !== false) render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.a === 'extra') A.extra(null, el);
  else if (el.dataset.f) S.me[el.dataset.f] = el.value;
});
setInterval(() => { if (!S.sess) return; const t = document.getElementById('timer'); if (!t) return; const d = Math.floor((Date.now() - S.sess.t0) / 1000); t.textContent = String(Math.floor(d / 60)).padStart(2, '0') + ':' + String(d % 60).padStart(2, '0'); }, 1000);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.cele) { A.celeOk(); render(); } });
render();
</script>
</html>
