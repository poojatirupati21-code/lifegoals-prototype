<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeGoals Prototype</title>
<meta name="description" content="Clickable customer-journey prototype for LifeGoals: Discover, Define, Prepare, Understand, Connect.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2545;--ink2:#13315C;--muted:#51627A;--line:#DCE4EC;--mist:#F3F7F9;--card:#FFFFFF;
  --sea:#0F9D8F;--sea-d:#0B7A70;--sea-l:#D9F2EE;--sun:#F2B134;--sun-l:#FDF0D2;--acc-d:#7A5200;--sand:#F8F5EE;
  --sky:#4E9BD8;--sky-l:#E1EFFA;--storm:#5E548E;--storm-l:#E7E3F4;--coral:#E8674A;
  --plain1:#CDEBE7;--plain2:#EAF5F4;--mark1:#6BE3D3;--mark2:#0F9D8F;--mark3:#0B2545;--r:22px;
  --ok:#2E9E6A;--ok-t:#1A7F4B;--ok-l:#E3F4EA;--dip:#F2B134;--dip-t:#8A5A00;--dip-l:#FDF0D2;--gap:#D9534F;--gap-t:#B42318;--gap-l:#FBE7E6;
  --fh:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--fb);color:var(--ink);background:#E4ECE8;display:flex;min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit}
h1,h2,h3,.disp{font-family:var(--fh);letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.wbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* side panel */
.side{width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:22px 18px;overflow-y:auto;max-height:100vh}
.side h1{margin:0;font-size:24px;display:flex;align-items:center;gap:10px}
.side p{font-size:13px;color:var(--muted);line-height:1.5;margin:6px 0 12px}
.side h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:10px;font-size:13px;cursor:pointer;min-height:32px}
.side button:hover{background:var(--mist)}.side button.on{background:var(--ink);color:#fff}
.side .big{background:var(--ink);color:#fff;text-align:center;font-weight:700;margin-bottom:6px;min-height:40px}.side .big:hover{background:var(--ink2)}
.side .big.alt{background:var(--sun);color:var(--ink)}.side .big.alt:hover{background:#E5A320}
.side .grp{font-size:11px;font-weight:800;color:var(--sea-d);margin:10px 10px 2px}
.side .jid{font-size:10.5px;opacity:.7;display:inline-block;width:52px;font-weight:700}
#curid{font-size:12px;line-height:1.45;background:var(--sun-l);color:var(--acc-d);border-radius:10px;padding:8px 10px;margin:6px 0 10px;min-height:36px}
.stage{flex-grow:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
#wrap{width:390px;height:844px;flex-shrink:0;transform-origin:center}
.phone{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:var(--mist);box-shadow:0 0 0 10px #0B1F22,0 30px 70px rgba(11,31,34,.35)}
@media (max-width:800px){body{display:block}.side{display:none}.stage{padding:0;height:100vh;height:100dvh}.phone{border-radius:0;box-shadow:none}}
/* shell */
#screen{position:absolute;inset:0}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.sky{flex-shrink:0;padding:46px 18px 12px;position:relative;background:linear-gradient(180deg,var(--plain1) 0%,var(--plain2) 70%,var(--mist) 100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:800;font-size:19px}
.mark{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--mark1),var(--mark2) 55%,var(--mark3));box-shadow:0 0 0 3px rgba(255,255,255,.7);flex-shrink:0}
.tb-btn{height:38px;min-width:38px;padding:0 12px;border-radius:19px;border:0;background:rgba(255,255,255,.8);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.backb{border:0;background:rgba(255,255,255,.8);height:38px;padding:0 14px 0 10px;border-radius:19px;font-weight:800;font-size:14px;cursor:pointer}
.scroll{flex-grow:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 24px;scroll-behavior:smooth}
.foot{flex-shrink:0;padding:10px 18px 26px;background:linear-gradient(180deg,rgba(243,247,249,0),var(--mist) 30%);display:grid;gap:8px}
.tabs{flex-shrink:0;height:80px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);align-items:start;padding-top:8px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#5C7477;cursor:pointer;min-height:50px}
.tabs button.on{color:var(--ink)}.tabs svg{width:24px;height:24px}
.tabs .center{margin-top:-28px}
.tabs .center .fab{width:60px;height:60px;border-radius:30px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(14,47,51,.35);border:4px solid #fff}
.tabs .center.on .fab{background:var(--sea-d)}
.tabs .dot{width:5px;height:5px;border-radius:3px;background:var(--sun);opacity:0}.tabs button.on .dot{opacity:1}
.phasebar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 2px}.phasebar i{height:5px;border-radius:3px;background:rgba(11,37,69,.12)}.phasebar i.on{background:var(--sea-d)}
/* type & blocks */
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-d)}
h2.t{font-size:27px;line-height:1.1;margin:6px 0 6px}
h3.h{font-size:19px;margin:0 0 4px;line-height:1.2}
.sub{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 14px}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}.sec h3{margin:0;font-size:18px}
.link{border:0;background:none;color:var(--sea-d);font-weight:800;font-size:13.5px;cursor:pointer;padding:8px 0;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 rgba(14,47,51,.04),0 6px 18px rgba(14,47,51,.06)}
.card+.card{margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:27px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-align:center;padding:0 18px}
.btn:hover{background:var(--ink2)}
.btn.sun{background:var(--sun);color:var(--ink)}.btn.sun:hover{background:#E5A320}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{min-height:44px;font-size:14px;width:auto;padding:0 18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 10px;border-radius:13px;font-size:12px;font-weight:800;line-height:1.3}
.pill.mint{background:var(--sea-l);color:var(--sea-d)}.pill.grey{background:#EEF2F0;color:var(--muted)}.pill.sunny{background:var(--sun-l);color:var(--acc-d)}.pill.red{background:var(--gap-l);color:var(--gap-t)}.pill.ok{background:var(--ok-l);color:var(--ok-t)}
.disc{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
.goal{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:#fff;box-shadow:0 6px 18px rgba(14,47,51,.06);cursor:pointer;border:0;width:100%;text-align:left;margin-bottom:10px;min-height:64px}
.goal .ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;background:var(--sand)}
.goal b{font-size:15.5px}.goal .chev{font-size:20px;color:var(--muted)}
.stat{width:28px;height:28px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;border:2px solid var(--line);color:var(--muted)}
.stat.done{background:var(--sea-d);border-color:var(--sea-d);color:#fff}.stat.look{background:var(--sun-l);border-color:var(--sun);color:var(--acc-d)}
.ring{position:relative;flex-shrink:0}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:800}
/* question screens */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--plain1) 0%,var(--mist) 55%,var(--sand) 100%);color:var(--ink)}
.qtop{padding:50px 18px 6px;display:flex;align-items:center;gap:10px}
.chaps{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.chaps i{height:6px;border-radius:3px;background:rgba(11,37,69,.1);overflow:hidden;position:relative}.chaps i b{position:absolute;inset:0;width:0;background:var(--sea-d);transition:width .3s}
.qx{width:44px;height:44px;border-radius:22px;border:0;background:rgba(11,37,69,.07);font-size:17px;cursor:pointer;flex-shrink:0}
.qbody{flex-grow:1;overflow-y:auto;padding:12px 18px 18px}
.qeye{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-d)}
.qbody h2{font-size:27px;line-height:1.12;margin:8px 0 6px}
.qsub{color:var(--muted);font-size:14.5px;margin:0 0 16px;line-height:1.45;min-height:4px}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;border:1px solid var(--line);border-radius:20px;padding:14px;min-height:74px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:#fff;color:var(--ink);box-shadow:0 6px 18px rgba(20,30,50,.08);transition:transform .15s,box-shadow .15s}
.opt:hover{transform:translateY(-2px)}.opts.two .opt{min-height:132px}
.opt .em{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;flex-shrink:0}
.opt .tx{font-size:16px;font-weight:800;line-height:1.25}
.opt.sel{box-shadow:0 0 0 3px var(--sea-d),0 8px 20px rgba(20,30,50,.12)}
.opt.sel::after{content:'✓';position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:12px;background:var(--sea-d);color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}
.opt.row1{flex-direction:row;align-items:center;min-height:62px;padding:10px 40px 10px 12px}
.opt.row1 .em{width:40px;height:40px;font-size:21px}.opt.row1 .tx{font-size:15px}
.opt svg{display:block}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:23px;min-height:46px;padding:0 14px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-align:left}
.chip.sel{background:var(--sea-d);color:#fff;border-color:var(--sea-d)}
.chip.sm{min-height:40px;font-size:13.5px;padding:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.qfoot{padding:8px 18px 28px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.qback{border:0;background:none;color:var(--muted);font-weight:700;font-size:14.5px;cursor:pointer;min-height:44px;padding:0 6px}
.wbtn{min-height:54px;border-radius:27px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:16px;padding:0 26px;cursor:pointer}
.wbtn[disabled]{opacity:.4;cursor:default}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,30,50,.06)}
.scn{display:flex;justify-content:space-between}.scn b{display:block;font-family:var(--fh);font-size:30px}
.medal{width:104px;height:104px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,var(--mark1),var(--mark2) 60%,var(--sea));box-shadow:0 14px 30px rgba(20,30,50,.15);margin:14px 0 16px}
/* forms */
.field{display:grid;gap:6px;margin-bottom:16px}
.field>label,.flabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:14.5px}
.in{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font-size:16px;background:#fff}
.in:focus{border-color:var(--sea-d);outline:none;box-shadow:0 0 0 3px var(--sea-l)}
.inw{position:relative}.inw .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);pointer-events:none}.inw .in.eur{padding-left:30px}
.fhelp{display:flex;gap:14px;flex-wrap:wrap}.fhelp .link{font-size:12.5px;padding:4px 0;min-height:32px}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.doc{background:var(--ok-l);color:var(--ok-t)}.tag.typed{background:#EEF2F0;color:var(--muted)}.tag.est{background:var(--sun-l);color:var(--acc-d)}.tag.none{background:#EEF2F0;color:var(--muted)}.tag.look{background:var(--gap-l);color:var(--gap-t)}.tag.pre{background:var(--sea-l);color:var(--sea-d)}
input[type=range]{width:100%;accent-color:var(--sea-d);height:32px}
.seg{display:flex;gap:4px;background:#E6EEEA;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:40px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:14.5px;line-height:1.45;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--sea-d);margin:1px 0 0;flex-shrink:0}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:#fff;min-height:50px;overflow:hidden}
.stepper button{width:48px;min-height:48px;border:0;background:var(--mist);font-size:20px;font-weight:800;cursor:pointer}
.stepper output{flex:1;text-align:center;font-weight:800;font-size:15px}
.codebox{display:flex;gap:8px;justify-content:space-between;margin:10px 0}
.codebox input{width:44px;height:54px;text-align:center;font-size:22px;font-weight:800;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.codebox input:focus{border-color:var(--sea-d);outline:none;box-shadow:0 0 0 3px var(--sea-l)}
.note{background:var(--sun-l);color:var(--acc-d);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
/* timeline */
.tl-board{background:linear-gradient(180deg,#fff,#F3F8FB);border:1px solid var(--line);border-radius:20px;padding:14px 12px 6px;position:relative;box-shadow:0 6px 18px rgba(14,47,51,.05)}
.tl-track{position:relative;margin:0 4px;touch-action:pan-y}
.tl-axis{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--sea),var(--ink))}
.tl-tick{position:absolute;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tl-tm{position:absolute;width:2px;height:8px;background:#B9C9D6;transform:translateX(-50%)}
.tl-now{position:absolute;width:14px;height:14px;border-radius:7px;background:var(--ink);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--ink)}
.tl-chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;height:36px;padding:0 10px 0 8px;border-radius:18px;background:#fff;border:2px solid var(--sea);font-size:12.5px;font-weight:800;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 8px rgba(14,42,71,.15)}
.tl-track.live .tl-chip{transition:top .18s ease,left .05s linear}
.tl-chip .yr{color:var(--sea-d);font-weight:800}
.tl-chip.ret{background:var(--ink);color:#fff;border-color:var(--ink)}.tl-chip.ret .yr{color:var(--sun)}
.tl-chip.drag{cursor:grabbing;border-color:var(--sun);z-index:5;box-shadow:0 10px 20px rgba(14,42,71,.28);transition:none}
.tl-chip.hl{border-color:var(--sun)}
.tl-stem{position:absolute;width:0;border-left:1.5px dashed #B9C9D6;pointer-events:none}
.tl-tip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;pointer-events:none;z-index:6}
.tl-hint{text-align:center;font-size:12.5px;color:var(--muted);padding:6px 0 6px}
.grow{background:#fff;border-radius:18px;padding:12px;margin-top:10px;box-shadow:0 4px 14px rgba(14,47,51,.05);border:1.5px solid transparent}
.grow.hl{border-color:var(--sun)}
.grow .hd{display:flex;align-items:center;gap:10px}
.grow .hd .e{font-size:24px;width:32px;text-align:center}
.grow .hd input{border:0;border-bottom:1.5px dashed var(--line);font-weight:800;font-size:15.5px;min-height:34px;flex:1;min-width:0;background:none}
.grow .hd input:focus{outline:none;border-bottom-color:var(--sea-d)}
.grow .flds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grow .flds .full{grid-column:1/-1}
.grow .fl{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.grow .in{min-height:44px;font-size:15px}.grow .stepper{min-height:44px}.grow .stepper button{min-height:42px;width:42px}
.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
/* results */
.prelim{display:flex;gap:8px;align-items:flex-start;background:var(--sea-l);color:var(--sea-d);border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:700;line-height:1.4;margin-bottom:12px}
.gs{display:flex;gap:12px;align-items:center;padding:9px 0}
.gs .e{font-size:24px;width:32px;text-align:center;flex-shrink:0}
.gs .m{flex:1;min-width:0}.gs .nm{font-size:15px;font-weight:800}.gs .nm span{font-weight:500;color:var(--muted)}
.gs .bar{height:9px;border-radius:5px;background:#E8EEF4;overflow:hidden;margin-top:6px}.gs .bar i{display:block;height:100%;border-radius:5px;transition:width .35s}
.gs .p{text-align:right;min-width:76px;font-weight:800;font-size:16px;line-height:1.15}.gs .p small{display:block;font-size:11.5px;font-weight:700}
.found{display:grid;gap:10px}
.fcard{border-radius:18px;padding:14px;border:1.5px solid var(--line);background:#fff}
.fcard .k{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.fcard b{display:block;font-size:15.5px;margin:4px 0 2px;line-height:1.35}
.wi-row{display:flex;align-items:center;gap:10px}
.wi-row .rb{width:46px;height:46px;border-radius:23px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer;flex-shrink:0}
.wi-val{font-family:var(--fh);font-weight:800;font-size:22px;text-align:center;flex:1}
.wi-out{background:var(--mist);border-radius:14px;padding:12px;font-size:14px;line-height:1.5;margin-top:12px}
.vt{display:flex;gap:4px;background:#E6EEEA;border-radius:14px;padding:4px;margin:12px 0}
.vt button{flex:1;border:0;background:none;border-radius:11px;min-height:44px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted);padding:0 4px}
.vt button.on{background:var(--ink);color:#fff}
.chapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chap{border:1.5px solid var(--line);border-radius:18px;padding:12px;background:#fff;cursor:pointer;text-align:left;display:block;width:100%;font-size:inherit}

const AS = {infl:0.02, wage:0.025, cash:0.01, inv:0.045, pen:0.045, sp:15044, spAge:66, end:90, mortRate:0.038, debtRate:0.09};
function netPay(g){ if (g <= 0) return 0; const it = Math.max(0, 0.2 * Math.min(g, 44000) + 0.4 * Math.max(0, g - 44000) - 4000); return g - it - 0.04 * g - (g > 18304 ? 0.042 * g : 0); }

  return {age:S.about.age, R:S.retireAge, partner:!!S.about.partner, pAge:n('pAge') || S.about.age, income:f.work === 'Not working' ? 0 : n('income'), pIncome:S.about.partner ? n('pIncome') : 0,
    otherM:n('otherM'), costsM:n('costsM') || val(FF.costsM.est), oneOffY:n('oneOffY'), cash:n('cash'), invest:n('invest'), rentM:n('rentM'),
    mortBal:mortOn ? n('mortBal') : 0, mortPayM:mortOn ? n('mortPayM') : 0, mortYears:mortOn ? n('mortYears') : 0, debt:n('debt'), debtPayM:n('debtPayM'),
    pension:n('pension'), pensionM:n('pensionM'), sp:f.sp === 'Expect full' ? 1 : f.sp === 'Partly' ? 0.6 : 0.8};
}
function project(wi){
  const f = finNums(), goals = S.goals, a0 = f.age, R = f.R, N = AS.end - a0;
  wi = wi || {}; const wg = wi.g != null ? goals.find(g => g.id === wi.g) : null, wm = +wi.m || 0, wl = +wi.l || 0;
  let cash = f.cash, inv = f.invest, pen = f.pension, ear = 0, mBal = f.mortBal, dBal = f.debt, mfreeDone = false;
  if (wg && wg.kind === 'retire') pen += wl; else if (wg) ear = wl;
  const res = {}; goals.forEach(g => { const s = Math.min(g.saved || 0, cash); res[g.id] = s; cash -= s; });
  const gf = {}; goals.forEach(g => gf[g.id] = {cost:0, cov:0});
  const rows = []; const rg = goals.find(g => g.kind === 'retire');
  for (let t = 0; t <= N; t++){
    const a = a0 + t, infl = Math.pow(1 + AS.infl, t), wgw = Math.pow(1 + AS.wage, t), working = a < R;
    let inflow = 0;
    if (working){ inflow += netPay(f.income * wgw) - 0.3 * f.pensionM * 12 * wgw;
      let contrib = f.pensionM * 12 * wgw; if (wg && wg.kind === 'retire') contrib = Math.max(0, contrib + wm * 12);
      pen = pen * (1 + AS.pen) + contrib;
    } else { const draw = pen / Math.max(1, AS.end - a + 1); pen = (pen - draw) * (1 + AS.pen * 0.7); inflow += draw * 0.9; }
    if (a >= AS.spAge) inflow += AS.sp * f.sp * infl;
    if (f.partner){ const pa = f.pAge + t; if (pa < 66) inflow += netPay(f.pIncome * wgw); else inflow += AS.sp * f.sp * infl; }
    inflow += (f.otherM + f.rentM) * 12 * infl;
    let living = working ? f.costsM * 12 * infl : (rg ? rg.amount * infl : f.costsM * 12 * infl * 0.8);
    living += f.oneOffY * infl;
    let fixed = 0;
    if (mBal > 1 && !mfreeDone){ const pay = Math.min(f.mortPayM * 12, mBal * (1 + AS.mortRate)); fixed += pay; mBal = mBal * (1 + AS.mortRate) - pay; }
    if (dBal > 1){ const pay = Math.min(Math.max(f.debtPayM * 12, dBal * 0.1), dBal * (1 + AS.debtRate)); fixed += pay; dBal = dBal * (1 + AS.debtRate) - pay; }
    if (!(wg && wg.kind === 'retire') && wm < 0 && working) fixed += -wm * 12; // saving less each month
    // earmarked what-if money grows until its goal
    if (wg && wg.kind !== 'retire' && wm > 0 && a < wg.age) ear = ear * (1 + 0.02) + wm * 12; else if (wg && wg.kind !== 'retire') ear *= 1.02;
    Object.keys(res).forEach(id => res[id] *= 1 + AS.cash);
    // goal costs this year
    const active = [];

      if (g.age !== a || (g.kind !== 'spend' && g.kind !== 'mfree')) return;
      let c = g.kind === 'mfree' ? (f.mortBal > 0 ? Math.max(0, mBal) : g.amount * infl) : g.amount * infl;
      const cost = c; let paid = Math.min(c, res[g.id] || 0); res[g.id] -= paid; c -= paid;
      if (wg && wg.id === g.id){ const p2 = Math.min(c, ear); ear -= p2; c -= p2; paid += p2; cash += ear; ear = 0; }
      cash += res[g.id] || 0; res[g.id] = 0;
      if (g.kind === 'mfree'){ mfreeDone = true; mBal = 0; }
      gf[g.id].cost += cost; gf[g.id].cov += paid; active.push({g, c});
    });
    const goalCost = active.reduce((s, x) => s + x.c, 0);

    if (net >= 0){ cash += net * 0.6; inv += net * 0.4; }
    else { let gap = -net; const a1 = Math.min(gap, cash); cash -= a1; gap -= a1; used += a1; const a2 = Math.min(gap, inv); inv -= a2; gap -= a2; used += a2; short = gap; }
    cash *= 1 + AS.cash; inv *= 1 + AS.inv;
    let unf = short;
    for (const {g, c} of active.slice().reverse()){ const hit = Math.min(unf, c); unf -= hit; gf[g.id].cov += c - hit; }
    if (rg && !working){ const hit = Math.min(unf, living); gf[rg.id].cost += living; gf[rg.id].cov += living - hit; unf -= hit; }

  return {rows, pct};
}

/* ================= TIMELINE: layout in lanes + drag ================= */
const LANE_H = 44;
function tlX(age, W){ const a0 = S.about.age; return (age - a0) / (90 - a0) * W; }
function layoutTL(){
  const tr = document.getElementById('tl'); if (!tr) return; const W = tr.clientWidth, a0 = S.about.age;
  const chips = [...tr.querySelectorAll('.tl-chip')].map(el => { const g = gById(el.dataset.g); return {el, g, w:el.offsetWidth, x:tlX(g.age, W)}; }).sort((a, b) => a.x - b.x || a.g.id - b.g.id);
  const lanes = [];
  chips.forEach(c => { const cx = clamp(c.x, c.w / 2, W - c.w / 2); c.left = cx - c.w / 2; let l = 0; while (lanes[l] != null && c.left < lanes[l] + 6) l++; lanes[l] = c.left + c.w; c.lane = l; });
  const L = Math.max(1, lanes.length), axisY = 10 + L * LANE_H + 12;
  tr.querySelectorAll('.tl-stem,.tl-axis,.tl-tick,.tl-tm,.tl-now').forEach(e => e.remove());
  let deco = '<div class="tl-axis" style="top:' + axisY + 'px"></div><div class="tl-now" style="left:0;top:' + (axisY + 2) + 'px" aria-hidden="true"></div>';
  for (let a = Math.ceil(a0 / 5) * 5; a <= 90; a += 5){ const x = tlX(a, W); deco += '<div class="tl-tm" style="left:' + x + 'px;top:' + (axisY + 6) + 'px"></div>' + (a % 10 === 0 && x > 22 ? '<div class="tl-tick" style="left:' + x + 'px;top:' + (axisY + 16) + 'px">' + a + '</div>' : ''); }
  deco += '<div class="tl-tick" style="left:14px;top:' + (axisY + 16) + 'px">Now</div><div class="tl-tick" style="left:' + (W - 8) + 'px;top:' + (axisY + 32) + 'px;font-size:10px">age</div>';
  chips.forEach(c => { const top = 10 + (L - 1 - c.lane) * LANE_H; c.el.style.left = c.left + 'px'; c.el.style.top = top + 'px'; deco += '<div class="tl-stem" style="left:' + c.x + 'px;top:' + (top + 36) + 'px;height:' + (axisY - top - 36) + 'px"></div>'; });
  tr.insertAdjacentHTML('afterbegin', deco);
  tr.style.height = (axisY + 46) + 'px';
}
function bindTL(){
  const tr = document.getElementById('tl');
  tr.querySelectorAll('.tl-chip').forEach(ch => {
    ch.addEventListener('pointerdown', e => {
      if (e.button > 0) return; e.preventDefault(); const g = gById(ch.dataset.g), sx = e.clientX, sAge = g.age; let moved = false, tip = null;
      try { ch.setPointerCapture(e.pointerId); } catch (x) {}
      ch.classList.add('drag'); tr.classList.add('live');
      const mv = ev => { if (!moved && Math.abs(ev.clientX - sx) < 5) return; moved = true; const r = tr.getBoundingClientRect(), a0 = S.about.age;
        const age = Math.round(sAge + (ev.clientX - sx) / r.width * (90 - a0)); const before = g.age; moveGoal(g, age);
        if (g.age !== before || !tip){ ch.innerHTML = chipInner(g); ch.setAttribute('aria-valuenow', g.age); layoutTL();
          if (!tip){ tip = document.createElement('div'); tip.className = 'tl-tip'; tr.appendChild(tip); }
          tip.textContent = g.name + ' · age ' + g.age + ' · ' + (YEAR0 + g.age - a0); tip.style.left = clamp(parseFloat(ch.style.left) + ch.offsetWidth / 2, 60, tr.clientWidth - 60) + 'px'; tip.style.top = (parseFloat(ch.style.top) - 6) + 'px';
          const w = document.getElementById('when-' + g.id); if (w) w.textContent = whenTxt(g); } };
      const up = () => { ch.removeEventListener('pointermove', mv); ch.removeEventListener('pointerup', up); ch.removeEventListener('pointercancel', up); ch.removeEventListener('lostpointercapture', up); ch.classList.remove('drag'); tr.classList.remove('live'); if (tip) tip.remove();
        if (!moved){ S.tlHl = g.id; render(); const row = document.getElementById('row-' + g.id); if (row) row.scrollIntoView({block:'nearest', behavior:RM() ? 'auto' : 'smooth'}); return; }
        if (S.app) version(g.name + ' moved to age ' + g.age); focusKey = '.tl-chip[data-g="' + g.id + '"]'; render(); toast(g.name + ' · age ' + g.age); };
      ch.addEventListener('pointermove', mv); ch.addEventListener('pointerup', up); ch.addEventListener('pointercancel', up); ch.addEventListener('lostpointercapture', up);
    });
    ch.addEventListener('keydown', e => { const g = gById(ch.dataset.g), st = e.shiftKey ? 5 : 1; let a = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') a = g.age + st; else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') a = g.age - st; else if (e.key === 'Home') a = 0; else if (e.key === 'End') a = 99;
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.tlHl = g.id; render(); document.getElementById('row-' + g.id).scrollIntoView({block:'nearest'}); return; }
      if (a == null) return; e.preventDefault(); moveGoal(g, a); focusKey = '.tl-chip[data-g="' + g.id + '"]'; render(); });
  });
}
